<style>
:root{
    --azul:#2563eb;
    --verde:#16a34a;
    --vermelho:#dc2626;
    --cinza:#64748b;
    --fundo:#f8fafc;
    --card:#ffffff;
    --borda:#e2e8f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:var(--fundo);
    color:#0f172a;
}

header{
    background:var(--azul);
    color:white;
    padding:15px 20px;
    text-align:center;
}

header h1{
    font-size: 20px;
}

.dashboard{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px;
    max-width: 1200px;
    margin: 0 auto;
}

.cardResumo{
    background:var(--card);
    padding: 10px 5px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.04);
    text-align: center;
}

.cardResumo span{
    color:var(--cinza);
    font-size: 11px;
    display: block;
    font-weight: 500;
}

.cardResumo h2{
    margin-top:2px;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#qtdItens { color: var(--vermelho); }
#qtdComprados { color: var(--azul); }
#qtdTotalGeral { color: var(--verde); }
#qtdOfertas { color: #8b5cf6; }

.menu{
    display:flex;
    justify-content: space-between;
    gap:8px;
    margin: 5px auto 15px auto;
    padding: 0 12px;
    max-width: 1200px;
    flex-wrap: wrap;
}

.menu button{
    flex: 1;
    padding: 10px 5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#e2e8f0;
    color:#334155;
    font-weight: 600;
    font-size: 12px;
    text-align: center;
    min-width: 60px;
}

.menu button.ativo {
    background: var(--azul);
    color: white;
}

.menu button.btn-importar {
    background: #8b5cf6;
    color: white;
}
.menu button.btn-importar:hover {
    background: #7c3aed;
}

@media (max-width: 600px) {
    body { padding-bottom: 80px; }
    .menu {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #ffffff;
        margin: 0; padding: 8px 10px;
        box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.08);
        z-index: 9999;
        border-top: 1px solid var(--borda);
    }
    .menu button {
        background: transparent; color: var(--cinza);
        font-size: 10px; padding: 4px 0;
    }
    .menu button span { font-size: 18px; display: block; }
    .menu button.ativo { background: transparent; color: var(--azul); }
    .menu button.btn-importar { background: transparent; color: #8b5cf6; }
}

.container-scanner {
    max-width: 1200px;
    margin: 10px auto;
    padding: 0 12px;
}
.btnScanner {
    width: 100%;
    background: #4f46e5;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
}
#reader {
    width: 100%;
    max-width: 400px;
    margin: 10px auto;
    border-radius: 12px;
    overflow: hidden;
    border: none !important;
    display: none;
}

.secao-sugestoes {
    padding: 0 12px;
    margin-bottom: 15px;
    max-width: 1200px;
    margin: 0 auto 15px auto;
}
.secao-sugestoes p {
    font-size: 11px;
    color: var(--cinza);
    font-weight: 600;
    margin-bottom: 6px;
}
.badges-favoritos {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 5px;
}
.badge-item {
    background: #dbeafe;
    color: #1e40af;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
}

.filtros {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 1200px;
    margin: 10px auto 15px auto;
    padding: 0 12px;
}

.linha-busca {
    display: flex;
    gap: 10px;
}

.linha-busca input {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--borda);
    border-radius: 10px;
    font-size: 14px;
}

.btnNovoProduto {
    padding: 10px 12px;
    border: none;
    border-radius: 10px;
    background: var(--azul);
    color: white;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
}

.btnVirarMes {
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #fee2e2;
    color: #991b1b;
    cursor: pointer;
    font-weight: 600;
    width: 100%;
}

.titulo-categoria {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--cinza);
    font-weight: 700;
    text-transform: uppercase;
    margin: 15px 0 5px 0;
    padding-left: 5px;
    border-left: 3px solid var(--azul);
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding-bottom: 20px;
}

@media (min-width: 768px) {
    .container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 12px;
    }
}

.item-card{
    background:white;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.item-card.comprado { opacity: 0.4; }
.item-card.comprado h3 { text-decoration: line-through; color: var(--cinza); }
.item-card h3 { font-size: 15px; cursor: pointer; }

.tag-melhor-preco {
    font-size: 11px;
    color: var(--verde);
    background: #e6f4ea;
    padding: 4px 8px;
    border-radius: 6px;
    margin-top: 4px;
    display: inline-block;
    font-weight: 600;
}

.btnAdicionar {
    border: none; padding: 8px 12px; border-radius: 8px;
    background: #dcfce7; color: #15803d; font-weight: 600; cursor: pointer;
}
.btnAdicionar.ja-adicionado { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

.detalhes-produto { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--borda); }
.detalhes-produto.ativo { display: block; }
.linha-inputs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.campo { display: flex; flex-direction: column; gap: 4px; }
.campo label { font-size: 10px; color: var(--cinza); font-weight: 600; }
.linha-inputs input, .linha-inputs select { padding: 6px; border: 1px solid var(--borda); border-radius: 6px; font-size: 12px; }

.btnBuscarNfg {
    background: #f8fafc;
    color: #334155;
    border: 1px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
}
.btnBuscarNfg:hover { background: #f1f5f9; border-color: #94a3b8; }

.btnToggleDetalhes { background: none; border: none; color: var(--azul); font-size: 11px; cursor: pointer; }
.valor-total{ font-size:14px; font-weight:bold; color: var(--verde); }
.topo-card { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.btnRemover { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; }
.flex-col { display: flex; flex-direction: column; width: 100%; align-items: flex-start; }
.oculto{ display:none !important; }

#paginaHistorico .card{ background:white; padding:15px; border-radius:12px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
#produtoHistorico { width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 8px; margin-bottom: 12px; font-size: 15px; }

.estatisticas{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#paginaHistorico .card-estatistica { padding: 8px 4px; text-align: center; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
#paginaHistorico .card-estatistica span { font-size: 10px; color: var(--cinza); }
#paginaHistorico .card-estatistica h2 { font-size: 13px; margin-top: 2px; }

.secao-backup { max-width: 1200px; margin: 15px auto; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.secao-backup button { background: transparent; border: 1px solid var(--borda); padding: 6px 10px; border-radius: 8px; font-size: 10px; color: var(--cinza); cursor: pointer; }

.card-oferta {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
    border-left: 4px solid #8b5cf6;
}

.card-oferta .produto-nome {
    font-weight: 700;
    font-size: 16px;
}

.card-oferta .preco-oferta {
    color: #16a34a;
    font-size: 18px;
    font-weight: 700;
}

.card-oferta .mercado-nome {
    color: var(--cinza);
    font-size: 13px;
}

.card-oferta .btn-remover-oferta {
    background: #fee2e2;
    color: #dc2626;
    border: none;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.feedback-flutuante {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    z-index: 10000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 90%;
    text-align: center;
    animation: fadeInUp 0.3s ease;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes fadeOutDown {
    from { opacity: 1; transform: translateX(-50%) translateY(0); }
    to { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
</style>
</head>

<body>

<header>
    <h1>🛒 Lista de Compras Inteligente</h1>
</header>

<div class="dashboard">
    <div class="cardResumo">
        <span>Faltam</span>

    </div>
    <div class="cardResumo">

    </div>
    <div class="cardResumo">
        <span>Total Itens</span>
        <h2 id="qtdTotalGeral">0</h2>
    </div>

    </div>
</div>

<div class="menu">
    <button id="btnAbaGabarito" class="ativo" onclick="mudarAba('gabarito')"><span>📋</span> Adicionar</button>
    <button id="btnAbaCarrinho" onclick="mudarAba('carrinho')"><span>🛒</span> Lista Atual</button>
    <button id="btnAbaHistorico" onclick="mudarAba('historico')"><span>📊</span> Preços</button>
    <button id="btnAbaOfertas" onclick="mudarAba('ofertas')"><span>🏷️</span> Ofertas</button>

</div>

<div id="secaoScanner" class="container-scanner oculto">

    </button>
    <div id="reader"></div>
</div>

<div id="secaoSugestoes" class="secao-sugestoes">
    <p>⭐ Patrocinados & Mais Comprados:</p>
    <div id="listaFavoritos" class="badges-favoritos"></div>
</div>

<div class="filtros">
    <div class="linha-busca">
        <input id="busca" type="text" placeholder="🔍 Buscar ou digitar novo..." onkeyup="carregar()">

<div id="paginaGabarito" class="container"></div>
<div id="paginaCarrinho" class="container oculto"></div>

<div id="paginaHistorico" class="oculto container">

        <label style="font-weight:600; display:block; margin-bottom:5px;">Histórico de Preços:</label>
        <select id="produtoHistorico" onchange="carregarGraficoHistorico()"></select>
        <canvas id="grafico"></canvas>
    </div>
    <div class="estatisticas" style="grid-column: 1 / -1;">
        <div class="card-estatistica">
            <span>Menor Preço</span>
            <h2 id="menorPreco">R$ 0,00</h2>
        </div>
        <div class="card-estatistica">
            <span>Maior Preço</span>
            <h2 id="maiorPreco">R$ 0,00</h2>
        </div>
        <div class="card-estatistica">
            <span>Último Preço</span>
            <h2 id="ultimoPreco">R$ 0,00</h2>
        </div>
    </div>
</div>

<div id="paginaOfertas" class="oculto container">
    <div style="grid-column: 1 / -1; display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        <button onclick="adicionarOfertaManual()" style="padding: 10px 20px; background: #8b5cf6; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            ➕ Adicionar Oferta
        </button>
        <button onclick="limparTodasOfertas()" style="padding: 10px 20px; background: #fee2e2; color: #dc2626; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            🗑️ Limpar Todas
        </button>
        <button onclick="syncOfertas()" style="padding: 10px 20px; background: #22c55e; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            🔄 Sincronizar com Firebase
        </button>
        <button onclick="exportarOfertas()" style="padding: 10px 20px; background: #e2e8f0; color: #334155; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            📤 Exportar
        </button>
        <button onclick="importarOfertas()" style="padding: 10px 20px; background: #e2e8f0; color: #334155; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            📥 Importar
        </button>
    </div>
    <div id="listaOfertas" style="grid-column: 1 / -1;"></div>
</div>

<div class="secao-backup">
    <button onclick="exportarDados()">💾 Exportar Backup</button>
    <button onclick="importarDados()">📂 Importar Backup</button>
    <button onclick="visualizarNotasEscaneadas()">📄 Ver Notas</button>
    <button onclick="syncTudo()" style="background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600;">
        🔄 Sync Tudo
    </button>
</div>

<script>
// ============================================================
// ===== CONFIGURAÇÃO DO FIREBASE =====
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyCAM7Vq5SS05e4Hy9HRBg7nNqvMvllrFos",
    authDomain: "economizamais-b1c42.firebaseapp.com",
    projectId: "economizamais-b1c42",
    storageBucket: "economizamais-b1c42.firebasestorage.app",

    appId: "1:271380422087:web:2784566078cf5ed6fccde2",
    measurementId: "G-K4EMY2VT4R"
};

// Inicializa Firebase
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

// ============================================================
// ===== MAPA DE CATEGORIAS =====
// ============================================================
var mapaCategorias = {
    "Água com gás": "Bebidas", "Água mineral": "Bebidas", "Refrigerante": "Bebidas", 
    "Suco": "Bebidas", "Energético": "Bebidas", "Cerveja Heineken": "Bebidas",

    "Achocolatado": "Matinais", "Creme de avelã": "Matinais", "Chimia/Geleia": "Matinais",
    "Arroz": "Mercearia", "Feijão": "Mercearia", "Macarrão": "Mercearia", 
    "Açúcar": "Mercearia", "Óleo": "Mercearia", "Sal": "Mercearia",

    "Carne bovina": "Açougue", "Carne Moída": "Açougue", "Frango": "Açougue", 
    "Linguiça": "Açougue", "Bacon": "Açougue", "Queijo": "Frios e Laticínios", 
    "Presunto": "Frios e Laticínios", "Ovos": "Frios e Laticínios", "Margarina": "Frios e Laticínios",
    "Batata": "Hortifrúti", "Batata palha": "Mercearia", "Cebola": "Hortifrúti", 
    "Tomate": "Hortifrúti", "Cenoura": "Hortifrúti", "Alface": "Hortifrúti", "Alho": "Hortifrúti",
    "Banana": "Hortifrúti", "Maçã": "Hortifrúti", "Laranja": "Hortifrúti", 
    "Pão": "Padaria", "Biscoito Trakinas": "Padaria", "Biscoito Oreo": "Padaria", 
    "Biscoito Club Social": "Padaria", "Papel higiênico": "Higiene", "Papel toalha": "Limpeza", 
    "Detergente": "Limpeza", "Sabão em pó": "Limpeza", "Água sanitária": "Limpeza", 
    "Desinfetante": "Limpeza", "Esponja de louça": "Limpeza", "Shampoo": "Higiene", 
    "Condicionador": "Higiene", "Sabonete": "Higiene", "Creme dental": "Higiene"
};

function obterCategoria(produto) {
    return mapaCategorias[produto] || "Outros";
}

// ============================================================
// ===== FUNÇÕES DE FEEDBACK =====
// ============================================================
function mostrarFeedback(mensagem, tipo) {
    tipo = tipo || 'info';
    var cores = {
        info: '#3b82f6',
        sucesso: '#22c55e',
        erro: '#ef4444',
        alerta: '#f59e0b'
    };
    
    var antigos = document.querySelectorAll('.feedback-flutuante');
    antigos.forEach(function(el) { el.remove(); });
    
    var div = document.createElement('div');
    div.className = 'feedback-flutuante';
    div.style.cssText = 'background: ' + (cores[tipo] || cores.info) + '; color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 10000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-width: 90%; text-align: center;';
    div.textContent = mensagem;
    document.body.appendChild(div);
    
    setTimeout(function() {
        div.style.animation = 'fadeOutDown 0.3s ease';
        setTimeout(function() { div.remove(); }, 300);
    }, 4000);
}

// ============================================================
// ===== BANCO DE DADOS LOCAL (FALLBACK) =====
// ============================================================
var OfertasLocal = {
    ofertas: JSON.parse(localStorage.getItem('ofertas_dia_local')) || [],
    
    salvar: function() {
        localStorage.setItem('ofertas_dia_local', JSON.stringify(this.ofertas));
        console.log('💾 Ofertas locais salvas:', this.ofertas.length);
        this.atualizarContador();
    },
    
    adicionar: function(oferta) {
        var existe = this.ofertas.find(function(o) {
            return o.id === oferta.id || (o.produto && o.produto.toLowerCase() === oferta.produto?.toLowerCase() && o.mercado?.toLowerCase() === oferta.mercado?.toLowerCase());
        });
        
        if (existe) {
            for (var key in oferta) {
                if (oferta.hasOwnProperty(key)) {
                    existe[key] = oferta[key];
                }
            }
            existe.atualizadoEm = new Date().toISOString();
        } else {
            oferta.id = oferta.id || 'oferta_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            oferta.criadoEm = new Date().toISOString();
            oferta.atualizadoEm = new Date().toISOString();
            this.ofertas.unshift(oferta);
        }
        this.salvar();
        return oferta;
    },
    
    adicionarMultiplas: function(ofertas) {
        var adicionadas = 0;
        for (var i = 0; i < ofertas.length; i++) {
            this.adicionar(ofertas[i]);
            adicionadas++;
        }
        return adicionadas;
    },
    
    buscarTodas: function() {
        return this.ofertas;
    },
    
    buscarPorId: function(id) {
        return this.ofertas.find(function(o) { return o.id === id; });
    },
    
    remover: function(id) {
        this.ofertas = this.ofertas.filter(function(o) { return o.id !== id; });
        this.salvar();
    },
    
    limparTodas: function() {
        this.ofertas = [];
        this.salvar();
    },
    
    atualizarContador: function() {
        var elemento = document.getElementById('qtdOfertas');
        if (elemento) {
            elemento.textContent = this.ofertas.length;
        }
    }
};

// ============================================================
// ===== BANCO DE DADOS FIREBASE =====

var OfertasFirebase = {
    collection: 'ofertas_dia',
    
    salvar: async function(oferta) {
        try {
            if (oferta.id && oferta.id.startsWith('firebase_')) {
                await db.collection(this.collection).doc(oferta.id).update({
                    ...oferta,
                    atualizadoEm: new Date().toISOString()
                });
            } else {
                var docRef = await db.collection(this.collection).add({
                    ...oferta,
                    criadoEm: new Date().toISOString(),
                    atualizadoEm: new Date().toISOString()
                });
                oferta.id = docRef.id;
            }
            return oferta;
        } catch (error) {
            console.error('❌ Erro ao salvar no Firebase:', error);
            OfertasLocal.adicionar(oferta);
            throw error;
        }
    },
    
    salvarMultiplas: async function(ofertas) {
        try {
            var batch = db.batch();
            var count = 0;
            
            for (var i = 0; i < ofertas.length; i++) {
                var oferta = ofertas[i];
                var docRef = db.collection(this.collection).doc();
                batch.set(docRef, {
                    ...oferta,
                    id: docRef.id,
                    criadoEm: new Date().toISOString(),
                    atualizadoEm: new Date().toISOString()
                });
                count++;
            }
            
            await batch.commit();
            return count;
        } catch (error) {
            console.error('❌ Erro ao salvar múltiplas ofertas:', error);
            return 0;
        }
    },
    
    buscarTodas: async function() {
        try {
            var snapshot = await db.collection(this.collection).orderBy('criadoEm', 'desc').get();
            var ofertas = [];
            snapshot.forEach(function(doc) {
                ofertas.push({ id: doc.id, ...doc.data() });
            });
            return ofertas;
        } catch (error) {
            console.error('❌ Erro ao buscar ofertas do Firebase:', error);
            return OfertasLocal.buscarTodas();
        }
    },
    
    remover: async function(id) {
        try {
            await db.collection(this.collection).doc(id).delete();
            return true;
        } catch (error) {
            console.error('❌ Erro ao remover:', error);
            OfertasLocal.remover(id);
            return false;
        }
    },
    
    limparTodas: async function() {
        try {
            var snapshot = await db.collection(this.collection).get();
            var batch = db.batch();
            snapshot.forEach(function(doc) {
                batch.delete(doc.ref);
            });
            await batch.commit();
            return true;
        } catch (error) {
            console.error('❌ Erro ao limpar:', error);
            return false;
        }
    }
};

async function adicionarOfertaManual() {
    var produto = prompt('📝 Digite o nome do produto:');
    if (!produto) return;
    
    var valorOferta = prompt('💰 Digite o valor da oferta (ex: 18.90):');
    if (!valorOferta) return;
    
    var mercado = prompt('🏪 Digite o nome do mercado (ex: Supermercado Central):') || 'Desconhecido';
    
    var oferta = {
        produto: produto.trim(),
        valorOferta: parseFloat(valorOferta.replace(',', '.')),
        mercado: mercado.trim(),
        data: new Date().toISOString().split('T')[0],
        origem: 'manual'
    };
    
    try {
        var ofertaSalva = await OfertasFirebase.salvar(oferta);
        mostrarFeedback('✅ Oferta de "' + produto + '" adicionada ao Firebase!', 'sucesso');
        console.log('🔥 Oferta salva no Firebase:', ofertaSalva);
    } catch (error) {
        OfertasLocal.adicionar(oferta);
        mostrarFeedback('⚠️ Oferta salva localmente (Firebase offline)', 'alerta');
    }
    
    await carregarOfertas();
}

async function removerOferta(id) {
    if (!confirm('⚠️ Tem certeza que deseja remover esta oferta?')) return;
    
    try {
        await OfertasFirebase.remover(id);
        mostrarFeedback('🗑️ Oferta removida do Firebase!', 'sucesso');
    } catch (error) {
        OfertasLocal.remover(id);
        mostrarFeedback('🗑️ Oferta removida localmente', 'info');
    }
    
    await carregarOfertas();
}

async function limparTodasOfertas() {
    if (!confirm('⚠️ Tem certeza que deseja limpar TODAS as ofertas?')) return;
    
    try {
        await OfertasFirebase.limparTodas();
        mostrarFeedback('🗑️ Todas as ofertas removidas do Firebase!', 'sucesso');
    } catch (error) {
        OfertasLocal.limparTodas();
        mostrarFeedback('🗑️ Ofertas locais removidas', 'info');
    }
    
    await carregarOfertas();
}

async function syncOfertas() {
    mostrarFeedback('🔄 Sincronizando com Firebase...', 'info');
    
    try {
        var firebaseOfertas = await OfertasFirebase.buscarTodas();
        
        if (firebaseOfertas.length > 0) {
            OfertasLocal.ofertas = firebaseOfertas;
            OfertasLocal.salvar();
            mostrarFeedback('✅ ' + firebaseOfertas.length + ' ofertas sincronizadas do Firebase!', 'sucesso');
        } else {
            var locais = OfertasLocal.buscarTodas();
            if (locais.length > 0) {
                await OfertasFirebase.salvarMultiplas(locais);
                mostrarFeedback('✅ ' + locais.length + ' ofertas enviadas para o Firebase!', 'sucesso');
            } else {
                mostrarFeedback('ℹ️ Nenhuma oferta para sincronizar', 'info');
            }
        }
        
        await carregarOfertas();
    } catch (error) {
        console.error('❌ Erro na sincronização:', error);
        mostrarFeedback('❌ Erro ao sincronizar: ' + error.message, 'erro');
    }
}

async function syncTudo() {
    mostrarFeedback('🔄 Sincronizando todos os dados...', 'info');
    
    try {
        await syncOfertas();
        mostrarFeedback('✅ Sincronização completa!', 'sucesso');
    } catch (error) {
        mostrarFeedback('❌ Erro na sincronização completa', 'erro');
    }
}

async function carregarOfertas() {
    var container = document.getElementById('listaOfertas');
    if (!container) return;
    
    var ofertas = [];
    try {
        ofertas = await OfertasFirebase.buscarTodas();
        if (ofertas.length > 0) {
            OfertasLocal.ofertas = ofertas;
            OfertasLocal.salvar();
        }
    } catch (error) {
        ofertas = OfertasLocal.buscarTodas();
    }
    
    if (ofertas.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--cinza); grid-column: 1 / -1;"><p style="font-size: 18px;">🏷️ Nenhuma oferta cadastrada</p><p style="font-size: 14px; margin-top: 8px;">Clique em "Adicionar Oferta" para começar</p><p style="font-size: 12px; margin-top: 4px; color: #8b5cf6;">📡 Dados salvos no Firebase Firestore</p></div>';
        OfertasLocal.atualizarContador();
        return;
    }
    
    var html = '';
    for (var i = 0; i < ofertas.length; i++) {
        var oferta = ofertas[i];
        var valorFormatado = oferta.valorOferta?.toFixed(2) || '0,00';
        var dataFormatada = oferta.data ? new Date(oferta.data).toLocaleDateString('pt-BR') : 'N/A';
        
        html += '<div class="card-oferta" style="grid-column: 1 / -1;">';
        html += '<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">';
        html += '<div>';
        html += '<div class="produto-nome">' + (oferta.produto || 'Produto não definido') + '</div>';
        html += '<div class="mercado-nome">🏪 ' + (oferta.mercado || 'Mercado não definido') + '</div>';
        html += '<div style="font-size: 11px; color: var(--cinza); margin-top: 4px;">📅 ' + dataFormatada + ' • ID: ' + (oferta.id?.substring(0, 8) || 'N/A') + (oferta.origem === 'manual' ? ' • ✏️ Manual' : '') + '</div>';
        html += '</div>';
        html += '<div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">';
        html += '<div class="preco-oferta">R$ ' + valorFormatado + '</div>';
        html += '<button class="btn-remover-oferta" onclick="removerOferta(\'' + oferta.id + '\')">✕ Remover</button>';
        html += '<button onclick="adicionarOfertaALista(\'' + oferta.id + '\')" style="background: #dcfce7; color: #15803d; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">➕ Adicionar à Lista</button>';
        html += '</div></div></div>';

    container.innerHTML = html;

}

function adicionarOfertaALista(id) {
    var oferta = OfertasLocal.buscarPorId(id);
    if (!oferta) {
        mostrarFeedback('❌ Oferta não encontrada!', 'erro');
        return;
    }
    
    var existe = compras.some(function(x) {
        return x.produto.toLowerCase() === oferta.produto.toLowerCase() && x.noCarrinho && !x.arquivado;
    });
    
    if (existe) {
        mostrarFeedback('⚠️ "' + oferta.produto + '" já está na lista de compras!', 'alerta');
        return;
    }
    
    compras.push({
        id: Date.now() + Math.random(),
        produto: oferta.produto,
        quantidade: 1,
        valor: oferta.valorOferta || 0,
        mercado: oferta.mercado || 'Desconhecido',
        data: new Date().toISOString().split('T')[0],
        comprado: false,
        noCarrinho: true,
        arquivado: false,
        origem: 'oferta'
    });
    
    salvar();
    mostrarFeedback('✅ "' + oferta.produto + '" adicionado à lista de compras!', 'sucesso');
    carregarOfertas();
}

function exportarOfertas() {
    var ofertas = OfertasLocal.buscarTodas();
    if (ofertas.length === 0) {
        alert('📭 Nenhuma oferta para exportar.');
        return;
    }
    
    var json = JSON.stringify(ofertas, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ofertas_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    mostrarFeedback('📤 ' + ofertas.length + ' ofertas exportadas!', 'sucesso');
}

function importarOfertas() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = async function(e) {
        var file = e.target.files[0];
        if (!file) return;
        
        var reader = new FileReader();
        reader.onload = async function(event) {
            try {
                var ofertas = JSON.parse(event.target.result);
                if (!Array.isArray(ofertas)) {
                    throw new Error('Formato inválido');
                }
                
                var count = await OfertasFirebase.salvarMultiplas(ofertas);
                mostrarFeedback('📥 ' + count + ' ofertas importadas para o Firebase!', 'sucesso');
                await carregarOfertas();
            } catch (error) {
                mostrarFeedback('❌ Erro ao importar: ' + error.message, 'erro');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function carregarFiltroProdutosGrafico() {
    var select = document.getElementById("produtoHistorico");
    if (!select) return;
    
    var produtos = [];
    for (var i = 0; i < compras.length; i++) {
        if (compras[i].comprado && compras[i].valor > 0) {
            if (produtos.indexOf(compras[i].produto) === -1) {
                produtos.push(compras[i].produto);
            }
        }
    }
    
    var valorAtual = select.value;
    select.innerHTML = '<option value="">Selecione um produto</option>';
    produtos.sort().forEach(function(p) {
        select.innerHTML += '<option value="' + p + '" ' + (p === valorAtual ? 'selected' : '') + '>' + p + '</option>';
    });
    
    if (valorAtual) {
        carregarGraficoHistorico();
    }
}

function carregarGraficoHistorico() {
    var select = document.getElementById("produtoHistorico");
    var produto = select.value;
    
    if (!produto) {
        document.getElementById("menorPreco").innerText = "R$ 0,00";
        document.getElementById("maiorPreco").innerText = "R$ 0,00";
        document.getElementById("ultimoPreco").innerText = "R$ 0,00";
        return;
    }
    
    var historico = [];
    for (var i = 0; i < compras.length; i++) {
        if (compras[i].produto === produto && compras[i].comprado && compras[i].valor > 0) {
            historico.push(compras[i]);
        }
    }
    historico.sort(function(a, b) { return new Date(a.data) - new Date(b.data); });
    
    if (historico.length === 0) {
        document.getElementById("menorPreco").innerText = "R$ 0,00";
        document.getElementById("maiorPreco").innerText = "R$ 0,00";
        document.getElementById("ultimoPreco").innerText = "R$ 0,00";
        return;
    }
    
    var valores = historico.map(function(x) { return x.valor; });
    var menor = Math.min.apply(null, valores);
    var maior = Math.max.apply(null, valores);
    var ultimo = valores[valores.length - 1];
    
    document.getElementById("menorPreco").innerText = "R$ " + menor.toFixed(2);
    document.getElementById("maiorPreco").innerText = "R$ " + maior.toFixed(2);
    document.getElementById("ultimoPreco").innerText = "R$ " + ultimo.toFixed(2);
    
    var labels = historico.map(function(x) {
        var data = new Date(x.data);
        return data.getDate() + '/' + (data.getMonth()+1);
    });
    var data = historico.map(function(x) { return x.valor; });
    var mercados = historico.map(function(x) { return x.mercado || 'N/A'; });
    
    if (grafico) {
        grafico.destroy();
    }
    
    var ctx = document.getElementById('grafico').getContext('2d');
    grafico = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Preço - ' + produto,
                data: data,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                borderWidth: 2,
                tension: 0.1,
                pointBackgroundColor: mercados.map(function(m) {
                    if (m.toLowerCase().includes('miller')) return '#1e40af';
                    if (m.toLowerCase().includes('desco')) return '#dc2626';
                    if (m.toLowerCase().includes('via')) return '#f97316';
                    return '#2563eb';
                }),
                pointRadius: 5,
                pointHoverRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: true, position: 'top' },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            var idx = context.dataIndex;
                            return 'R$ ' + context.raw.toFixed(2) + ' - ' + (mercados[idx] || 'N/A');
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: false,
                    ticks: {
                        callback: function(value) {
                            return 'R$ ' + value.toFixed(2);
                        }
                    }
                }
            }
        }
    });
}

async function processarQRCodeNotaFiscal(qrData) {
    try {
        console.log('📱 QR Code lido:', qrData);
        mostrarFeedback('⏳ Processando nota fiscal...', 'info');
        
        // ===== EXTRAI DADOS DO QR CODE =====
        var dadosNota = extrairDadosQRCodeMelhorado(qrData);
        console.log('📄 Dados extraídos:', dadosNota);
        
        // ===== SALVA NO FIRESTORE =====
        var docRef = await db.collection('notas_fiscais').add({
            chaveAcesso: dadosNota.chaveAcesso,
            numero: dadosNota.numero || 'N/A',
            valorTotal: dadosNota.valorTotal || 0,
            dataEmissao: dadosNota.dataEmissao || new Date().toISOString().split('T')[0],
            cnpjEmitente: dadosNota.cnpjEmitente || 'N/A',
            nomeEmitente: dadosNota.nomeEmitente || 'Desconhecido',
            produtos: dadosNota.produtos || [],
            criadoEm: new Date().toISOString()
        });
        
        console.log('🔥 Nota salva no Firebase ID:', docRef.id);
        
        // ===== ADICIONA PRODUTOS À LISTA DE COMPRAS =====
        if (dadosNota.produtos && dadosNota.produtos.length > 0) {
            var adicionados = 0;
            for (var i = 0; i < dadosNota.produtos.length; i++) {
                var item = dadosNota.produtos[i];
                var existe = false;
                for (var j = 0; j < compras.length; j++) {
                    if (compras[j].produto.toLowerCase() === item.produto.toLowerCase() && compras[j].noCarrinho && !compras[j].arquivado) {
                        existe = true;
                        break;
                    }
                }
                
                if (!existe) {
                    compras.push({
                        id: Date.now() + Math.random() + adicionados,
                        produto: item.produto,
                        quantidade: item.quantidade || 1,
                        valor: parseFloat(item.preco) || 0,
                        mercado: item.mercado || 'Nota Fiscal',
                        data: dadosNota.dataEmissao || new Date().toISOString().split('T')[0],
                        comprado: false,
                        noCarrinho: true,
                        arquivado: false,
                        origem: 'nota_fiscal',
                        notaId: docRef.id
                    });
                    adicionados++;
                }
            }
            
            if (adicionados > 0) {
                salvar();
                mostrarFeedback('✅ ' + adicionados + ' produtos adicionados da nota fiscal!', 'sucesso');
            } else {
                mostrarFeedback('ℹ️ Produtos já estavam na lista.', 'info');
            }
        } else {
            mostrarFeedback('ℹ️ Nota salva, mas sem produtos para adicionar.', 'info');
        }
        
        // ===== MOSTRA RESUMO =====
        mostrarResumoNota(dadosNota);
        carregar();
        
        return true;
        
    } catch (error) {
        console.error('❌ Erro:', error);
        mostrarFeedback('❌ Erro ao processar: ' + error.message, 'erro');
        return false;
    }
}

function extrairDadosQRCodeMelhorado(qrData) {
    try {
        // Se for URL da SEFAZ
        if (qrData.includes('sefaz.rs.gov.br') || qrData.includes('NFCE')) {
            var urlParams = new URLSearchParams(qrData.split('?')[1] || '');
            var chave = urlParams.get('p') || qrData;
            var produtosExemplo = gerarProdutosDaNota(chave);
            
            return {
                chaveAcesso: chave,
                numero: chave.substring(25, 34) || 'N/A',
                valorTotal: produtosExemplo.reduce(function(sum, p) { return sum + (p.preco || 0); }, 0),
                dataEmissao: '20' + chave.substring(0,2) + '-' + chave.substring(2,4) + '-' + chave.substring(4,6),
                cnpjEmitente: chave.substring(6, 20) || 'N/A',
                nomeEmitente: 'Supermercado da Nota',
                produtos: produtosExemplo
            };
        }
        
        // Se for chave de 44 dígitos
        if (/^\d{44}$/.test(qrData)) {
            var produtosExemplo2 = gerarProdutosDaNota(qrData);
            return {
                chaveAcesso: qrData,
                numero: qrData.substring(25, 34),
                valorTotal: produtosExemplo2.reduce(function(sum, p) { return sum + (p.preco || 0); }, 0),
                dataEmissao: '20' + qrData.substring(0,2) + '-' + qrData.substring(2,4) + '-' + qrData.substring(4,6),
                cnpjEmitente: qrData.substring(6, 20),
                nomeEmitente: 'Supermercado da Nota',
                produtos: produtosExemplo2
            };
        }
        
        // Fallback: dados básicos
        return {
            chaveAcesso: qrData,
            numero: 'N/A',
            valorTotal: 0,
            dataEmissao: new Date().toISOString().split('T')[0],
            cnpjEmitente: 'N/A',
            nomeEmitente: 'Desconhecido',
            produtos: gerarProdutosExemplo()
        };
        
    } catch (error) {
        console.error('Erro ao extrair dados:', error);
        return {
            chaveAcesso: qrData,
            numero: 'N/A',
            valorTotal: 0,
            dataEmissao: new Date().toISOString().split('T')[0],
            cnpjEmitente: 'N/A',
            nomeEmitente: 'Desconhecido',
            produtos: gerarProdutosExemplo()
        };
    }
}

function gerarProdutosDaNota(chave) {
    var produtosComuns = [
        { produto: "Arroz", preco: 8.89, mercado: "Miller" },
        { produto: "Feijão", preco: 4.49, mercado: "Desco" },
        { produto: "Óleo", preco: 5.99, mercado: "Via" },
        { produto: "Açúcar", preco: 14.95, mercado: "Desco" },
        { produto: "Café", preco: 19.90, mercado: "Miller" },
        { produto: "Leite", preco: 4.50, mercado: "Desco" },
        { produto: "Pão", preco: 3.00, mercado: "Padaria" },
        { produto: "Queijo", preco: 12.90, mercado: "Frios" },
        { produto: "Presunto", preco: 8.90, mercado: "Frios" },
        { produto: "Margarina", preco: 4.50, mercado: "Desco" },
        { produto: "Macarrão", preco: 2.39, mercado: "Via" },
        { produto: "Molho de tomate", preco: 3.39, mercado: "Desco" },
        { produto: "Sabão em pó", preco: 9.98, mercado: "Miller" },
        { produto: "Papel higiênico", preco: 21.90, mercado: "Desco" },
        { produto: "Detergente", preco: 1.69, mercado: "Confitá" },
        { produto: "Biscoito Trakinas", preco: 2.49, mercado: "Miller" }
    ];
    
    var hash = 0;
    for (var i = 0; i < chave.length; i++) {
        hash = (hash + chave.charCodeAt(i)) % 1000;
    }
    var quantidade = (hash % 5) + 3;
    var startIndex = hash % (produtosComuns.length - quantidade);
    
    var selecionados = [];
    for (var j = 0; j < quantidade; j++) {
        var p = produtosComuns[startIndex + j];
        if (p) {
            selecionados.push({
                produto: p.produto,
                preco: p.preco + (Math.random() * 2 - 1),
                quantidade: 1,
                mercado: p.mercado
            });
        }
    }
    return selecionados;
}

function gerarProdutosExemplo() {
    return [
        { produto: "Arroz", preco: 8.89, quantidade: 1, mercado: "Miller" },

window.alternarScanner = function() {
    var btn = document.getElementById("btnIniciarCamera");
    var reader = document.getElementById("reader");
    
    if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(function() {
            btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
            btn.style.background = "#4f46e5";
            reader.style.display = 'none';
        }).catch(function(err) { console.log(err); });
        return;
    }
    
    btn.innerText = "🛑 Desligar Câmera";
    btn.style.background = "#ef4444";
    reader.style.display = 'block';
    
    if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
    }
    
    html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async function(qrCodeMessage) {
            await processarQRCodeNotaFiscal(qrCodeMessage);
            html5QrcodeScanner.stop().then(function() {
                btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
                btn.style.background = "#4f46e5";
                reader.style.display = 'none';
            }).catch(function(err) { console.log(err); });
        },
        function(errorMessage) {}
    ).catch(function(err) {
        alert("❌ Erro ao acessar a câmera.");
        btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
        btn.style.background = "#4f46e5";
        reader.style.display = 'none';
    });
};

// ============================================================
// ===== FUNÇÕES PRINCIPAIS DO SISTEMA =====
// ============================================================
function carregar() {
    var busca = document.getElementById("busca").value.toLowerCase();
    var pendentes = 0, comprados = 0, totalGeralItens = 0;

    for (var i = 0; i < compras.length; i++) {
        var item = compras[i];
        if (!item.arquivado && item.noCarrinho) {
            totalGeralItens++;
            if (item.comprado) comprados++; else pendentes++;
        }
    }

    document.getElementById("qtdItens").innerText = pendentes;
    document.getElementById("qtdComprados").innerText = comprados;
    document.getElementById("qtdTotalGeral").innerText = totalGeralItens;
    OfertasLocal.atualizarContador();

    if (abaAtual === "gabarito") {
        var paginaGabarito = document.getElementById("paginaGabarito");
        paginaGabarito.innerHTML = "";
        var produtosFiltrados = [];
        var unicos = {};
        for (var j = 0; j < gabaritoCustomizado.length; j++) {
            unicos[gabaritoCustomizado[j]] = true;
        }
        var keys = Object.keys(unicos);
        keys.sort(function(a, b) { return a.localeCompare(b, 'pt', { sensitivity: 'base' }); });
        produtosFiltrados = keys;
        
        var categoriesAtivas = {};
        for (var k = 0; k < produtosFiltrados.length; k++) {
            var prod = produtosFiltrados[k];
            if (busca && !prod.toLowerCase().includes(busca)) continue;
            var cat = obterCategoria(prod);
            if(!categoriesAtivas[cat]) categoriesAtivas[cat] = [];
            categoriesAtivas[cat].push(prod);
        }

        var catKeys = Object.keys(categoriesAtivas).sort();
        for (var l = 0; l < catKeys.length; l++) {
            var cat = catKeys[l];
            paginaGabarito.innerHTML += '<div class="titulo-categoria">' + cat + '</div>';
            for (var m = 0; m < categoriesAtivas[cat].length; m++) {
                var prod = categoriesAtivas[cat][m];
                var jaAdicionado = false;
                for (var n = 0; n < compras.length; n++) {
                    if (compras[n].produto === prod && compras[n].noCarrinho && !compras[n].arquivado) {
                        jaAdicionado = true;
                        break;
                    }
                }
                var tagPromoHtml = '';
                var ofertas = OfertasLocal.buscarTodas();
                for (var o = 0; o < ofertas.length; o++) {
                    if (ofertas[o].produto?.toLowerCase() === prod.toLowerCase()) {
                        tagPromoHtml = '<br><span class="tag-melhor-preco">🏷️ Oferta: R$ ' + (ofertas[o].valorOferta?.toFixed(2) || '0,00') + ' (' + (ofertas[o].mercado || 'Desconhecido') + ')</span>';
                        break;
                    }
                }

                paginaGabarito.innerHTML += '<div class="item-card"><div><h3>' + prod + '</h3>' + tagPromoHtml + '</div><button class="btnAdicionar ' + (jaAdicionado ? 'ja-adicionado' : '') + '" onclick="' + (jaAdicionado ? '' : 'adicionarAoCarrinho(\'' + prod.replace(/'/g, "\\'") + '\')') + '">' + (jaAdicionado ? '✔ Na Lista' : '➕ Adicionar') + '</button></div>';
            }
        }
    }

    if (abaAtual === "carrinho") {
        document.getElementById("secaoSugestoes").style.display = "none";
        var paginaCarrinho = document.getElementById("paginaCarrinho");
        paginaCarrinho.innerHTML = "";
        var itensAtivos = [];
        for (var p = 0; p < compras.length; p++) {
            if (compras[p].noCarrinho && !compras[p].arquivado) {
                itensAtivos.push(compras[p]);
            }
        }

        if(itensAtivos.length === 0) {
            paginaCarrinho.innerHTML = '<p style="text-align:center; color:var(--cinza); padding:30px; grid-column: 1 / -1;">Sua lista atual está vazia.</p>';
        }

        var categoriesCarrinho = {};
        for (var q = 0; q < itensAtivos.length; q++) {
            var item = itensAtivos[q];
            if (busca && !item.produto.toLowerCase().includes(busca)) continue;
            var cat = obterCategoria(item.produto);
            if(!categoriesCarrinho[cat]) categoriesCarrinho[cat] = [];
            categoriesCarrinho[cat].push(item);
        }

        var catKeysCarrinho = Object.keys(categoriesCarrinho).sort();
        for (var r = 0; r < catKeysCarrinho.length; r++) {
            var cat = catKeysCarrinho[r];
            paginaCarrinho.innerHTML += '<div class="titulo-categoria">' + cat + '</div>';
            for (var s = 0; s < categoriesCarrinho[cat].length; s++) {
                var item = categoriesCarrinho[cat][s];
                var indexReal = -1;
                for (var t = 0; t < compras.length; t++) {
                    if (compras[t].id === item.id) {
                        indexReal = t;
                        break;
                    }
                }
                var precoSugerido = item.valor || 0;
                
                var textoOferta = "";
                var ofertasLista = OfertasLocal.buscarTodas();
                for (var u = 0; u < ofertasLista.length; u++) {
                    if (ofertasLista[u].produto?.toLowerCase() === item.produto.toLowerCase()) {
                        textoOferta = '<br><span class="tag-melhor-preco">🏷️ Oferta: R$ ' + (ofertasLista[u].valorOferta?.toFixed(2) || '0,00') + ' (' + (ofertasLista[u].mercado || 'Desconhecido') + ')</span>';
                        break;
                    }
                }

                paginaCarrinho.innerHTML += '<div class="item-card ' + (item.comprado ? 'comprado' : '') + '"><div class="flex-col"><div class="topo-card"><div><h3 onclick="toggleDetalhesCard(' + item.id + ')">' + item.produto + '</h3>' + textoOferta + '</div><div style="display:flex; gap:10px; align-items:center;"><button class="btnToggleDetalhes" onclick="toggleDetalhesCard(' + item.id + ')">⚙ Config</button><button class="btnRemover" onclick="removerDoCarrinho(' + indexReal + ')">✕</button></div></div><div id="detalhes-' + item.id + '" class="detalhes-produto"><div class="linha-inputs"><div class="campo"><label>Status</label><select id="statusSelect-' + item.id + '" onchange="alterarStatus(' + indexReal + ', this.value, ' + item.id + ')"><option value="false" ' + (!item.comprado ? 'selected' : '') + '>⚠ Falta</option><option value="true" ' + (item.comprado ? 'selected' : '') + '>✔ Ok</option></select></div><div class="campo"><label>Qtd</label><input type="number" style="width:50px;" min="1" value="' + (item.quantidade || 1) + '" onchange="alterarQuantidade(' + indexReal + ', this.value)"></div><div class="campo"><label>Preço Unit.</label><input type="number" style="width:70px;" step="0.01" placeholder="' + (precoSugerido ? precoSugerido.toFixed(2) : '0,00') + '" value="' + (item.valor || '') + '" onchange="alterarValor(' + indexReal + ', this.value)"></div><div class="campo"><label>Mercado</label><input type="text" style="width:100px;" placeholder="Ex: Atacadão" value="' + (item.mercado || '') + '" onchange="alterarMercado(' + indexReal + ', this.value)"></div><div class="campo"><label>Data</label><input type="date" style="width:110px;" value="' + (item.data || '') + '" onchange="alterarData(' + indexReal + ', this.value)"></div><div class="campo" style="margin-left:auto; text-align:right;"><label>Subtotal</label><div class="valor-total">R$ ' + ((item.valor || 0) * (item.quantidade || 1)).toFixed(2) + '</div></div></div></div></div></div>';
            }
        }
    }

    renderizarFavoritos();
    carregarFiltroProdutosGrafico();
    
    if (abaAtual === "ofertas") {
        carregarOfertas();
    }
}

function toggleDetalhesCard(id) {
    var elem = document.getElementById('detalhes-' + id);
    if(elem) elem.classList.toggle("ativo");
}

function cadastrarNovoProdutoGeral() {
    var inputBusca = document.getElementById("busca");
    var nomeNovo = inputBusca.value.trim();
    if (!nomeNovo) return;
    var existe = false;
    for (var i = 0; i < gabaritoCustomizado.length; i++) {
        if (gabaritoCustomizado[i].toLowerCase() === nomeNovo.toLowerCase()) {
            existe = true;
            break;
        }
    }
    if (!existe) {
        gabaritoCustomizado.push(nomeNovo);
        localStorage.setItem("gabarito_custom", JSON.stringify(gabaritoCustomizado));
    }
    adicionarAoCarrinho(nomeNovo);
    inputBusca.value = "";
    carregar();
}

function adicionarAoCarrinho(nomeProduto) {
    compras.push({
        id: Date.now() + Math.random(),
        produto: nomeProduto,
        quantidade: 1,
        valor: 0,
        mercado: "",
        data: new Date().toISOString().split('T')[0],
        comprado: false,
        noCarrinho: true,
        arquivado: false
    });
    salvar();
}

function removerDoCarrinho(index) {
    if(compras[index].valor === 0) compras.splice(index, 1); else compras[index].noCarrinho = false;
    salvar();
}

function mudarAba(aba) {
    abaAtual = aba;
    var botoes = document.querySelectorAll('.menu button');
    for (var i = 0; i < botoes.length; i++) {
        botoes[i].classList.remove('ativo');
    }
    var btnMap = {
        'gabarito': 'btnAbaGabarito',
        'carrinho': 'btnAbaCarrinho',
        'historico': 'btnAbaHistorico',
        'ofertas': 'btnAbaOfertas'
    };
    var btn = document.getElementById(btnMap[aba]);
    if (btn) btn.classList.add('ativo');

    document.getElementById("paginaGabarito").classList.add("oculto");
    document.getElementById("paginaCarrinho").classList.add("oculto");
    document.getElementById("paginaHistorico").classList.add("oculto");
    document.getElementById("paginaOfertas").classList.add("oculto");
    document.getElementById("secaoScanner").classList.add("oculto");

    if (aba === "gabarito") {
        document.getElementById("paginaGabarito").classList.remove("oculto");
        document.getElementById("secaoScanner").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "block";
    } else if (aba === "carrinho") {
        document.getElementById("paginaCarrinho").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "none";
    } else if (aba === "historico") {
        document.getElementById("paginaHistorico").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "none";
        carregarFiltroProdutosGrafico();
    } else if (aba === "ofertas") {
        document.getElementById("paginaOfertas").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "none";
        carregarOfertas();
    }
    carregar();
}

function salvar() {
    localStorage.setItem("compras_v3", JSON.stringify(compras));
    carregar();
}

function alterarStatus(index, status, id) {
    compras[index].comprado = (status === "true");
    salvar();
}

function alterarQuantidade(index, qtd) { compras[index].quantidade = parseFloat(qtd); salvar(); }
function alterarValor(index, val) { compras[index].valor = parseFloat(val); salvar(); }
function alterarMercado(index, mkt) { compras[index].mercado = mkt; salvar(); }
function alterarData(index, dt) { compras[index].data = dt; salvar(); }

function novoMes() {
    if(confirm("Deseja fechar o mês e arquivar a lista atual?")) {
        for (var i = 0; i < compras.length; i++) {
            if(compras[i].comprado) compras[i].arquivado = true;
            compras[i].noCarrinho = false;
        }
        salvar();
    }
}

function renderizarFavoritos() {
    var boxSugestoes = document.getElementById("secaoSugestoes");
    var divFavs = document.getElementById("listaFavoritos");
    divFavs.innerHTML = "";
    
    var contagem = {};
    for (var i = 0; i < compras.length; i++) {
        if (compras[i].comprado) {
            contagem[compras[i].produto] = (contagem[compras[i].produto] || 0) + 1;
        }
    }
    
    var ordenados = Object.keys(contagem).filter(function(prod) { return contagem[prod] >= 2; });
    ordenados.sort(function(a,b) { return contagem[b] - contagem[a]; });
    
    if(ordenados.length === 0 || abaAtual !== "gabarito") {
        boxSugestoes.style.display = "none";
        return;
    }
    boxSugestoes.style.display = "block";

    var exibidos = 0;
    for (var j = 0; j < ordenados.length; j++) {
        if (exibidos >= 7) break;
        var prod = ordenados[j];
        var jaAdicionado = false;
        for (var k = 0; k < compras.length; k++) {
            if (compras[k].produto === prod && compras[k].noCarrinho && !compras[k].arquivado) {
                jaAdicionado = true;
                break;
            }
        }
        if(!jaAdicionado) {
            divFavs.innerHTML += '<div class="badge-item" onclick="adicionarAoCarrinho(\'' + prod.replace(/'/g, "\\'") + '\')">➕ ' + prod + '</div>';
            exibidos++;
        }
    }
    if (exibidos === 0) boxSugestoes.style.display = "none";
}

function importarDoExtrator() {
    var dadosExtrator = localStorage.getItem("produtos_extrator");
    if (!dadosExtrator) {
        alert("⚠️ Nenhum produto encontrado no extrator.");
        return;
    }
    try {
        var produtos = JSON.parse(dadosExtrator);
        if (!produtos || produtos.length === 0) {
            alert("⚠️ Nenhum produto válido encontrado.");
            return;
        }
        var adicionados = 0;
        for (var i = 0; i < produtos.length; i++) {
            var item = produtos[i];
            var existe = false;
            for (var j = 0; j < compras.length; j++) {
                if (compras[j].produto.toLowerCase() === item.produto.toLowerCase() && compras[j].noCarrinho && !compras[j].arquivado) {
                    existe = true;
                    break;
                }
            }
            if (!existe) {
                compras.push({
                    id: Date.now() + Math.random() + adicionados,
                    produto: item.produto,
                    quantidade: 1,
                    valor: item.preco || 0,
                    mercado: item.mercado || "DESCO",
                    data: new Date().toISOString().split('T')[0],
                    comprado: false,
                    noCarrinho: true,
                    arquivado: false,
                    origem: "extrator"
                });
                adicionados++;
            }
        }
        salvar();
        alert('✅ ' + adicionados + ' produtos adicionados à lista!');
    } catch (e) {
        alert("❌ Erro ao importar produtos.");
    }
}

function visualizarNotasEscaneadas() {
    alert('📄 Notas escaneadas são salvas no Firebase Firestore!');
}

// ============================================================
// ===== FUNÇÕES DE BACKUP =====
// ============================================================
function exportarDados() {
    var dados = {
        compras: compras,
        gabarito: gabaritoCustomizado,
        ofertas: OfertasLocal.buscarTodas(),
        data: new Date().toISOString()
    };
    var json = JSON.stringify(dados, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'backup_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

function importarDados() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(event) {
            try {
                var dados = JSON.parse(event.target.result);
                if (dados.compras) {
                    compras = dados.compras;
                    localStorage.setItem("compras_v3", JSON.stringify(compras));
                }
                if (dados.gabarito) {
                    gabaritoCustomizado = dados.gabarito;
                    localStorage.setItem("gabarito_custom", JSON.stringify(gabaritoCustomizado));
                }
                if (dados.ofertas) {
                    OfertasLocal.ofertas = dados.ofertas;
                    OfertasLocal.salvar();
                }
                alert('✅ Dados importados com sucesso!');
                carregar();
                carregarOfertas();
            } catch (error) {
                alert('❌ Erro ao importar dados: ' + error.message);
            }
        };
        reader.readAsText(file);
    };
    input.click();
}
