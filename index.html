<style>
/* ... (mesmo CSS anterior) ... */
:root{
    --azul:#2563eb;
    --verde:#16a34a;
    --vermelho:#dc2626;
    --cinza:#64748b;
    --fundo:#f8fafc;

    box-sizing:border-box;

}

body{

.card-oferta {

.feedback-flutuante {

    left: 50%;

    font-weight: 600;
    font-size: 14px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    max-width: 90%;
    text-align: center;
    animation: fadeInUp 0.3s ease;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes fadeOutDown {
    from { opacity: 1; transform: translateX(-50%) translateY(0); }
    to { opacity: 0; transform: translateX(-50%) translateY(20px); }

<body>

<header>
    <h1>🛒 Lista de Compras Inteligente</h1>
</header>

<div class="dashboard">
    <div class="cardResumo">
        <span>Faltam</span>
        <h2 id="qtdItens">0</h2>
    </div>
    <div class="cardResumo">
        <span>Comprados</span>
        <h2 id="qtdComprados">0</h2>
    </div>
    <div class="cardResumo">
        <span>Total Itens</span>
        <h2 id="qtdTotalGeral">0</h2>
    </div>
    <div class="cardResumo">
        <span>Ofertas</span>
        <h2 id="qtdOfertas">0</h2>
    </div>
</div>

<div class="menu">
    <button id="btnAbaGabarito" class="ativo" onclick="mudarAba('gabarito')"><span>📋</span> Adicionar</button>
    <button id="btnAbaCarrinho" onclick="mudarAba('carrinho')"><span>🛒</span> Lista Atual</button>
    <button id="btnAbaHistorico" onclick="mudarAba('historico')"><span>📊</span> Preços</button>
    <button id="btnAbaOfertas" onclick="mudarAba('ofertas')"><span>🏷️</span> Ofertas</button>
    <button class="btn-importar" onclick="importarDoExtrator()"><span>📥</span> Importar</button>
</div>

<div id="secaoScanner" class="container-scanner oculto">
    <button class="btnScanner" id="btnIniciarCamera" onclick="alternarScanner()">
        📷 Escanear QR Code da Nota Gaúcha
    </button>
    <div id="reader"></div>
</div>

<div id="secaoSugestoes" class="secao-sugestoes">
    <p>⭐ Patrocinados & Mais Comprados:</p>
    <div id="listaFavoritos" class="badges-favoritos"></div>
</div>

<div class="filtros">
    <div class="linha-busca">
        <input id="busca" type="text" placeholder="🔍 Buscar ou digitar novo..." onkeyup="carregar()">
        <button class="btnNovoProduto" onclick="cadastrarNovoProdutoGeral()"> Criar</button>
    </div>
    <button id="btnVirarMes" class="btnVirarMes oculto" onclick="novoMes()"> Fechar Mês / Limpar Lista</button>
</div>

<div id="paginaGabarito" class="container"></div>
<div id="paginaCarrinho" class="container oculto"></div>

<div id="paginaHistorico" class="oculto container">
    <div class="card" style="grid-column: 1 / -1;">
        <label style="font-weight:600; display:block; margin-bottom:5px;">Histórico de Preços:</label>
        <select id="produtoHistorico" onchange="carregarGraficoHistorico()"></select>
        <canvas id="grafico"></canvas>
    </div>
    <div class="estatisticas" style="grid-column: 1 / -1;">
        <div class="card-estatistica">
            <span>Menor Preço</span>
            <h2 id="menorPreco">R$ 0,00</h2>
        </div>
        <div class="card-estatistica">
            <span>Maior Preço</span>
            <h2 id="maiorPreco">R$ 0,00</h2>
        </div>
        <div class="card-estatistica">
            <span>Último Preço</span>
            <h2 id="ultimoPreco">R$ 0,00</h2>
        </div>
    </div>
</div>

<div id="paginaOfertas" class="oculto container">
    <div style="grid-column: 1 / -1; display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        <button onclick="adicionarOfertaManual()" style="padding: 10px 20px; background: #8b5cf6; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            ➕ Adicionar Oferta
        </button>
        <button onclick="limparTodasOfertas()" style="padding: 10px 20px; background: #fee2e2; color: #dc2626; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            🗑️ Limpar Todas
        </button>
        <button onclick="exportarOfertas()" style="padding: 10px 20px; background: #e2e8f0; color: #334155; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            📤 Exportar
        </button>
        <button onclick="importarOfertas()" style="padding: 10px 20px; background: #e2e8f0; color: #334155; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
            📥 Importar
        </button>
    </div>
    <div id="listaOfertas" style="grid-column: 1 / -1;"></div>
</div>

<div class="secao-backup">
    <button onclick="exportarDados()">💾 Exportar Backup</button>
    <button onclick="importarDados()">📂 Importar Backup</button>
    <button onclick="visualizarNotasEscaneadas()">📄 Ver Notas</button>
</div>

<script>
// ============================================================
// ===== MAPA DE CATEGORIAS =====
// ============================================================
const mapaCategorias = {
    "Água com gás": "Bebidas", "Água mineral": "Bebidas", "Refrigerante": "Bebidas", 
    "Suco": "Bebidas", "Energético": "Bebidas", "Cerveja Heineken": "Bebidas", 
    "Café": "Matinais", "Leite": "Matinais", "Erva-mate": "Matinais", 
    "Achocolatado": "Matinais", "Creme de avelã": "Matinais", "Chimia/Geleia": "Matinais",
    "Arroz": "Mercearia", "Feijão": "Mercearia", "Macarrão": "Mercearia", 
    "Açúcar": "Mercearia", "Óleo": "Mercearia", "Sal": "Mercearia", 
    "Farinha de trigo": "Mercearia", "Farofa": "Mercearia", "Vinagre": "Mercearia",
    "Molho de tomate": "Mercearia", "Milho verde": "Enlatados", "Ervilha": "Enlatados", 
    "Maionese": "Molhos", "Ketchup": "Molhos", "Mostarda": "Molhos",
    "Carne bovina": "Açougue", "Carne Moída": "Açougue", "Frango": "Açougue", 
    "Linguiça": "Açougue", "Bacon": "Açougue", "Queijo": "Frios e Laticínios", 
    "Presunto": "Frios e Laticínios", "Ovos": "Frios e Laticínios", "Margarina": "Frios e Laticínios",
    "Batata": "Hortifrúti", "Batata palha": "Mercearia", "Cebola": "Hortifrúti", 
    "Tomate": "Hortifrúti", "Cenoura": "Hortifrúti", "Alface": "Hortifrúti", "Alho": "Hortifrúti",
    "Banana": "Hortifrúti", "Maçã": "Hortifrúti", "Laranja": "Hortifrúti", 
    "Pão": "Padaria", "Biscoito Trakinas": "Padaria", "Biscoito Oreo": "Padaria", 
    "Biscoito Club Social": "Padaria", "Papel higiênico": "Higiene", "Papel toalha": "Limpeza", 
    "Detergente": "Limpeza", "Sabão em pó": "Limpeza", "Água sanitária": "Limpeza", 
    "Desinfetante": "Limpeza", "Esponja de louça": "Limpeza", "Shampoo": "Higiene", 
    "Condicionador": "Higiene", "Sabonete": "Higiene", "Creme dental": "Higiene"
};

function obterCategoria(produto) {
    return mapaCategorias[produto] || "Outros";
}

// ============================================================
// ===== BANCO DE DADOS DE OFERTAS =====
// ============================================================
const OfertasDB = {
    ofertas: JSON.parse(localStorage.getItem('ofertas_dia')) || [],
    
    salvar() {
        localStorage.setItem('ofertas_dia', JSON.stringify(this.ofertas));
        console.log('💾 Ofertas salvas:', this.ofertas.length);
        this.atualizarContador();
    },
    
    adicionar(oferta) {
        const existe = this.ofertas.find(o => 
            o.id === oferta.id || 
            (o.produto && o.produto.toLowerCase() === oferta.produto?.toLowerCase() && 
             o.mercado?.toLowerCase() === oferta.mercado?.toLowerCase())
        );
        
        if (existe) {
            Object.assign(existe, oferta);
            existe.atualizadoEm = new Date().toISOString();
        } else {
            oferta.id = oferta.id || `oferta_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            oferta.criadoEm = new Date().toISOString();
            oferta.atualizadoEm = new Date().toISOString();
            this.ofertas.unshift(oferta);
        }
        this.salvar();
        return oferta;
    },
    
    adicionarMultiplas(ofertas) {
        let adicionadas = 0;
        for (const oferta of ofertas) {
            this.adicionar(oferta);
            adicionadas++;
        }
        return adicionadas;
    },
    
    buscarTodas() {
        return this.ofertas;
    },
    
    buscarPorMercado(mercado) {
        return this.ofertas.filter(o => o.mercado?.toLowerCase() === mercado?.toLowerCase());
    },
    
    buscarPorProduto(produto) {
        return this.ofertas.filter(o => 
            o.produto?.toLowerCase().includes(produto.toLowerCase())
        );
    },
    
    buscarPorId(id) {
        return this.ofertas.find(o => o.id === id);
    },
    
    remover(id) {
        this.ofertas = this.ofertas.filter(o => o.id !== id);
        this.salvar();
    },
    
    limparTodas() {
        if (confirm('⚠️ Tem certeza que deseja limpar todas as ofertas?')) {
            this.ofertas = [];
            this.salvar();
            return true;
        }
        return false;
    },
    
    atualizarContador() {
        const elemento = document.getElementById('qtdOfertas');
        if (elemento) {
            elemento.textContent = this.ofertas.length;
        }
    }
};

// ============================================================
// ===== BANCO DE DADOS DE NOTAS FISCAIS =====
// ============================================================
const DB = {
    notasFiscais: JSON.parse(localStorage.getItem('notas_fiscais_db')) || [],
    produtosNota: JSON.parse(localStorage.getItem('produtos_nota_atual')) || [],
    
    salvar() {
        localStorage.setItem('notas_fiscais_db', JSON.stringify(this.notasFiscais));
        localStorage.setItem('produtos_nota_atual', JSON.stringify(this.produtosNota));
    },
    
    adicionarNota(nota) {
        const existe = this.notasFiscais.find(n => n.chaveAcesso === nota.chaveAcesso);
        if (existe) {
            Object.assign(existe, nota);
            existe.atualizadoEm = new Date().toISOString();
        } else {
            nota.criadoEm = new Date().toISOString();
            nota.atualizadoEm = new Date().toISOString();
            this.notasFiscais.unshift(nota);
        }
        this.salvar();
        return nota;
    },
    
    buscarNotas() {
        return this.notasFiscais;
    },
    
    buscarNotaPorChave(chave) {
        return this.notasFiscais.find(n => n.chaveAcesso === chave);
    }
};

function mostrarFeedback(mensagem, tipo = 'info') {
    const cores = {
        info: '#3b82f6',
        sucesso: '#22c55e',
        erro: '#ef4444',
        alerta: '#f59e0b'
    };

function adicionarOfertaALista(id) {
    const oferta = OfertasDB.buscarPorId(id);

        return;
    }
    
    const existe = compras.some(x => 
        x.produto.toLowerCase() === oferta.produto.toLowerCase() && 
        x.noCarrinho &&

    );
    
    if (existe) {
        mostrarFeedback(`⚠️ "${oferta.produto}" já está na lista de compras!`, 'alerta');

function exportarOfertas() {
    const ofertas = OfertasDB.buscarTodas();
    if (ofertas.length === 0) {
        alert('📭 Nenhuma oferta para exportar.');
        return;
    }
    
    const json = JSON.stringify(ofertas, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ofertas_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    mostrarFeedback(`📤 ${ofertas.length} ofertas exportadas com sucesso!`, 'sucesso');
}

function importarOfertas() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const ofertas = JSON.parse(event.target.result);
                if (!Array.isArray(ofertas)) {
                    throw new Error('Formato inválido');
                }
                
                const adicionadas = OfertasDB.adicionarMultiplas(ofertas);
                mostrarFeedback(`📥 ${adicionadas} ofertas importadas com sucesso!`, 'sucesso');
                carregarOfertas();
            } catch (error) {
                mostrarFeedback('❌ Erro ao importar ofertas: ' + error.message, 'erro');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function carregarGraficoHistorico() {
    const select = document.getElementById("produtoHistorico");
    const produto = select.value;
    
    if (!produto) {
        document.getElementById("menorPreco").innerText = "R$ 0,00";
        document.getElementById("maiorPreco").innerText = "R$ 0,00";
        document.getElementById("ultimoPreco").innerText = "R$ 0,00";
        return;
    }
    
    const historico = compras
        .filter(x => x.produto === produto && x.comprado && x.valor > 0)
        .sort((a, b) => new Date(a.data) - new Date(b.data));
    
    if (historico.length === 0) {
        document.getElementById("menorPreco").innerText = "R$ 0,00";
        document.getElementById("maiorPreco").innerText = "R$ 0,00";
        document.getElementById("ultimoPreco").innerText = "R$ 0,00";
        return;
    }
    
    const valores = historico.map(x => x.valor);
    const menor = Math.min(...valores);
    const maior = Math.max(...valores);
    const ultimo = valores[valores.length - 1];
    
    document.getElementById("menorPreco").innerText = `R$ ${menor.toFixed(2)}`;
    document.getElementById("maiorPreco").innerText = `R$ ${maior.toFixed(2)}`;
    document.getElementById("ultimoPreco").innerText = `R$ ${ultimo.toFixed(2)}`;
    
    const labels = historico.map(x => {
        const data = new Date(x.data);
        return `${data.getDate()}/${data.getMonth()+1}`;
    });
    const data = historico.map(x => x.valor);
    const mercados = historico.map(x => x.mercado || 'N/A');
    
    if (grafico) {
        grafico.destroy();
    }
    
    const ctx = document.getElementById('grafico').getContext('2d');
    grafico = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: `Preço - ${produto}`,
                data: data,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                borderWidth: 2,
                tension: 0.1,
                pointBackgroundColor: mercados.map(m => {
                    if (m.toLowerCase().includes('miller')) return '#1e40af';
                    if (m.toLowerCase().includes('desco')) return '#dc2626';
                    if (m.toLowerCase().includes('via')) return '#f97316';
                    return '#2563eb';
                }),
                pointRadius: 5,
                pointHoverRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                    position: 'top'
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const idx = context.dataIndex;
                            return `R$ ${context.raw.toFixed(2)} - ${mercados[idx] || 'N/A'}`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: false,
                    ticks: {
                        callback: function(value) {
                            return 'R$ ' + value.toFixed(2);
                        }
                    }
                }
            }
        }
    });
}

async function processarQRCodeNotaFiscal(qrData) {
    try {
        console.log('📱 QR Code lido:', qrData);
        mostrarFeedback('⏳ Processando nota fiscal...', 'info');
        
        // ===== PASSO 1: Extrair dados do QR Code =====
        const dadosNota = extrairDadosQRCode(qrData);
        
        if (!dadosNota || !dadosNota.produtos || dadosNota.produtos.length === 0) {
            // Se não tem produtos no QR, busca da API simulada
            console.log('🔍 Buscando produtos da nota via API...');
            const produtosAPI = await buscarProdutosAPI(qrData);
            
            if (produtosAPI && produtosAPI.length > 0) {
                dadosNota.produtos = produtosAPI;
            } else {
                // Se ainda não tem produtos, usa produtos de exemplo
                dadosNota.produtos = gerarProdutosExemplo();
            }
        }
        
        console.log('📦 Produtos extraídos:', dadosNota.produtos);
        
        // ===== PASSO 2: Salvar nota no banco =====
        const notaSalva = DB.adicionarNota(dadosNota);
        console.log('💾 Nota salva:', notaSalva);
        
        // ===== PASSO 3: Adicionar produtos à lista de compras =====
        let adicionados = 0;
        let jaExistentes = 0;
        
        for (const item of dadosNota.produtos) {
            // Verifica se já está na lista
            const existe = compras.some(x => 
                x.produto.toLowerCase() === item.produto.toLowerCase() && 
                x.noCarrinho && 
                !x.arquivado
            );
            
            if (!existe) {
                compras.push({
                    id: Date.now() + Math.random() + adicionados,
                    produto: item.produto,
                    quantidade: item.quantidade || 1,
                    valor: parseFloat(item.preco) || 0,
                    mercado: item.mercado || 'Nota Fiscal',
                    data: dadosNota.dataEmissao || new Date().toISOString().split('T')[0],
                    comprado: false,
                    noCarrinho: true,
                    arquivado: false,
                    origem: 'nota_fiscal',
                    notaChave: dadosNota.chaveAcesso
                });
                adicionados++;
            } else {
                jaExistentes++;
            }
        }
        
        // ===== PASSO 4: Salvar e atualizar =====
        if (adicionados > 0) {
            salvar();
            mostrarFeedback(`✅ ${adicionados} produtos adicionados da nota fiscal!`, 'sucesso');
        } else if (jaExistentes > 0) {
            mostrarFeedback(`ℹ️ Todos os ${jaExistentes} produtos já estavam na lista.`, 'info');
        } else {
            mostrarFeedback('⚠️ Nenhum produto encontrado na nota.', 'alerta');
        }
        
        // ===== PASSO 5: Mostrar resumo =====
        mostrarResumoNota(dadosNota);
        
        // ===== PASSO 6: Recarregar interface =====
        carregar();
        
        return true;
        
    } catch (error) {
        console.error('❌ Erro ao processar QR Code:', error);
        mostrarFeedback('❌ Erro ao processar nota: ' + error.message, 'erro');
        return false;
    }
}

// Extrai dados do QR Code da nota fiscal
function extrairDadosQRCode(qrData) {
    try {
        // Tenta extrair como JSON
        try {
            const jsonData = JSON.parse(qrData);
            if (jsonData.chave_acesso || jsonData.chaveAcesso) {
                return {
                    chaveAcesso: jsonData.chave_acesso || jsonData.chaveAcesso || qrData,
                    numero: jsonData.numero || jsonData.numero_nota || 'N/A',
                    valorTotal: parseFloat(jsonData.valor_total || jsonData.valor || 0),
                    dataEmissao: jsonData.data_emissao || jsonData.data || new Date().toISOString().split('T')[0],
                    cnpjEmitente: jsonData.cnpj_emitente || jsonData.cnpj || 'N/A',
                    nomeEmitente: jsonData.nome_emitente || jsonData.emitente || 'Desconhecido',
                    produtos: jsonData.produtos || []
                };
            }
        } catch (e) {}
        
        // Tenta extrair como URL com parâmetros
        if (qrData.includes('?') || qrData.includes('&')) {
            const urlParams = new URLSearchParams(qrData.split('?')[1] || '');
            const chave = urlParams.get('chave') || urlParams.get('p') || qrData;
            
            // Tenta extrair produtos da URL
            const produtosStr = urlParams.get('produtos') || urlParams.get('itens') || '';
            let produtos = [];
            
            if (produtosStr) {
                try {
                    produtos = JSON.parse(decodeURIComponent(produtosStr));
                } catch (e) {
                    // Tenta parsear como lista simples
                    produtos = produtosStr.split(',').map(p => ({
                        produto: p.trim(),
                        quantidade: 1,
                        preco: 0
                    }));
                }
            }
            
            return {
                chaveAcesso: chave,
                numero: urlParams.get('n') || urlParams.get('numero') || 'N/A',
                valorTotal: parseFloat(urlParams.get('v') || '0'),
                dataEmissao: urlParams.get('d') || new Date().toISOString().split('T')[0],
                cnpjEmitente: urlParams.get('c') || 'N/A',
                nomeEmitente: urlParams.get('e') || 'Desconhecido',
                produtos: produtos
            };
        }
        
        // Chave de 44 dígitos
        if (/^\d{44}$/.test(qrData)) {
            return {
                chaveAcesso: qrData,
                numero: qrData.substring(25, 34),
                valorTotal: 0,
                dataEmissao: `20${qrData.substring(0,2)}-${qrData.substring(2,4)}-${qrData.substring(4,6)}`,
                cnpjEmitente: qrData.substring(6, 20),
                nomeEmitente: 'Desconhecido',
                produtos: []
            };
        }
        
        // Formato com separador
        const campos = qrData.split('|');
        if (campos.length >= 2) {
            return {
                chaveAcesso: campos[0] || qrData,
                numero: campos[1] || 'N/A',
                valorTotal: parseFloat(campos[2] || '0'),
                dataEmissao: campos[3] || new Date().toISOString().split('T')[0],
                cnpjEmitente: campos[4] || 'N/A',
                nomeEmitente: campos[5] || 'Desconhecido',
                produtos: []
            };
        }
        
        // Fallback: usar o dado bruto
        return {
            chaveAcesso: qrData,
            numero: 'N/A',
            valorTotal: 0,
            dataEmissao: new Date().toISOString().split('T')[0],
            cnpjEmitente: 'N/A',
            nomeEmitente: 'Desconhecido',
            produtos: []
        };
        
    } catch (error) {
        console.error('Erro ao extrair dados do QR:', error);
        return {
            chaveAcesso: qrData,
            numero: 'N/A',
            valorTotal: 0,
            dataEmissao: new Date().toISOString().split('T')[0],
            cnpjEmitente: 'N/A',
            nomeEmitente: 'Desconhecido',
            produtos: []
        };
    }
}

// Busca produtos de uma API simulada
async function buscarProdutosAPI(chaveAcesso) {
    console.log('🔍 Buscando produtos para chave:', chaveAcesso);
    
    // Simula delay de rede
    await new Promise(resolve => setTimeout(resolve, 1000));
    
    // Lista de produtos comuns em notas fiscais
    const produtosComuns = [
        { produto: "Arroz", preco: 8.89, mercado: "Miller" },
        { produto: "Feijão", preco: 4.49, mercado: "Desco" },
        { produto: "Óleo", preco: 5.99, mercado: "Via" },
        { produto: "Açúcar", preco: 14.95, mercado: "Desco" },
        { produto: "Café", preco: 19.90, mercado: "Miller" },
        { produto: "Leite", preco: 4.50, mercado: "Desco" },
        { produto: "Pão", preco: 3.00, mercado: "Padaria" },
        { produto: "Queijo", preco: 12.90, mercado: "Frios" },
        { produto: "Presunto", preco: 8.90, mercado: "Frios" },
        { produto: "Margarina", preco: 4.50, mercado: "Desco" },
        { produto: "Macarrão", preco: 2.39, mercado: "Via" },
        { produto: "Molho de tomate", preco: 3.39, mercado: "Desco" },
        { produto: "Sabão em pó", preco: 9.98, mercado: "Miller" },
        { produto: "Papel higiênico", preco: 21.90, mercado: "Desco" },
        { produto: "Detergente", preco: 1.69, mercado: "Confitá" },
        { produto: "Biscoito Trakinas", preco: 2.49, mercado: "Miller" }
    ];
    
    // Seleciona produtos aleatórios baseados na chave
    const hash = chaveAcesso.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
    const quantidade = (hash % 6) + 3; // 3 a 8 produtos
    const startIndex = hash % (produtosComuns.length - quantidade);
    
    const produtosSelecionados = produtosComuns.slice(startIndex, startIndex + quantidade);
    
    return produtosSelecionados.map((p, index) => ({
        ...p,
        quantidade: 1,
        preco: p.preco + (Math.random() * 2 - 1) // Varia um pouco o preço
    }));
}

// Gera produtos de exemplo quando não encontra nada
function gerarProdutosExemplo() {
    const exemplos = [
        { produto: "Arroz", preco: 8.89, quantidade: 1, mercado: "Miller" },
        { produto: "Feijão", preco: 4.49, quantidade: 1, mercado: "Desco" },
        { produto: "Óleo", preco: 5.99, quantidade: 1, mercado: "Via" },
        { produto: "Café", preco: 19.90, quantidade: 1, mercado: "Miller" },
        { produto: "Leite", preco: 4.50, quantidade: 1, mercado: "Desco" }
    ];
    
    // Seleciona 3-5 produtos aleatórios
    const quantidade = Math.floor(Math.random() * 3) + 3;
    const selecionados = [];
    const copia = [...exemplos];
    
    for (let i = 0; i < quantidade && copia.length > 0; i++) {
        const index = Math.floor(Math.random() * copia.length);
        selecionados.push(copia.splice(index, 1)[0]);
    }
    
    return selecionados;
}

    let mensagem = '📋 NOTAS FISCAIS ESCANEADAS:\n\n';
    mensagem += '═'.repeat(40) + '\n';
    
    notas.forEach((nota, index) => {
        mensagem += `📄 NOTA #${index + 1}\n`;
        mensagem += `   Chave: ${nota.chaveAcesso?.substring(0, 15) || 'N/A'}...\n`;
        mensagem += `   Número: ${nota.numero || 'N/A'}\n`;
        mensagem += `   Emitente: ${nota.nomeEmitente || 'N/A'}\n`;
        mensagem += `   Data: ${nota.dataEmissao || 'N/A'}\n`;
        mensagem += `   Valor: R$ ${nota.valorTotal?.toFixed(2) || '0,00'}\n`;
        mensagem += `   Produtos: ${nota.produtos?.length || 0} itens\n`;
        mensagem += `   Escaneado: ${nota.criadoEm ? new Date(nota.criadoEm).toLocaleString() : 'N/A'}\n`;
        mensagem += '─'.repeat(40) + '\n';
        
        if (nota.produtos && nota.produtos.length > 0) {
            mensagem += '   📦 Produtos:\n';
            nota.produtos.forEach((p, i) => {
                mensagem += `      ${i+1}. ${p.produto} - R$ ${p.preco?.toFixed(2) || '0,00'}\n`;
            });
            mensagem += '─'.repeat(40) + '\n';
        }
    });
    
    alert(mensagem);
}

window.alternarScanner = function() {
    const btn = document.getElementById("btnIniciarCamera");
    const reader = document.getElementById("reader");
    
    if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => {
            btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
            btn.style.background = "#4f46e5";
            reader.style.display = 'none';
        }).catch(err => console.log(err));
        return;
    }
    
    btn.innerText = "🛑 Desligar Câmera";
    btn.style.background = "#ef4444";
    reader.style.display = 'block';
    
    if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
    }
    
    html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async (qrCodeMessage) => {
            // Processa o QR Code
            await processarQRCodeNotaFiscal(qrCodeMessage);
            
            // Para o scanner após ler
            html5QrcodeScanner.stop().then(() => {
                btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
                btn.style.background = "#4f46e5";
                reader.style.display = 'none';
            }).catch(err => console.log(err));
        },
        (errorMessage) => {}
    ).catch(err => {
        alert("❌ Erro ao acessar a câmera.");
        btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
        btn.style.background = "#4f46e5";
        reader.style.display = 'none';
    });
};

// ============================================================
// ===== FUNÇÕES PRINCIPAIS DO SISTEMA =====
// ============================================================
function carregar() {
    const busca = document.getElementById("busca").value.toLowerCase();
    let pendentes = 0, comprados = 0, totalGeralItens = 0;

    compras.forEach(item => {
        if (!item.arquivado && item.noCarrinho) {
            totalGeralItens++;
            if (item.comprado) comprados++; else pendentes++;
        }
    });

    document.getElementById("qtdItens").innerText = pendentes;
    document.getElementById("qtdComprados").innerText = comprados;
    document.getElementById("qtdTotalGeral").innerText = totalGeralItens;
    OfertasDB.atualizarContador();

    if (abaAtual === "gabarito") {
        const paginaGabarito = document.getElementById("paginaGabarito");
        paginaGabarito.innerHTML = "";
        let produtosFiltrados = [...new Set(gabaritoCustomizado)].sort((a, b) => a.localeCompare(b, 'pt', { sensitivity: 'base' }));
        let categoriesAtivas = {};
        
        produtosFiltrados.forEach(prod => {
            if (busca && !prod.toLowerCase().includes(busca)) return;
            let cat = obterCategoria(prod);
            if(!categoriesAtivas[cat]) categoriesAtivas[cat] = [];
            categoriesAtivas[cat].push(prod);
        });

        Object.keys(categoriesAtivas).sort().forEach(cat => {
            paginaGabarito.innerHTML += `<div class="titulo-categoria">${cat}</div>`;
            categoriesAtivas[cat].forEach(prod => {
                const jaAdicionado = compras.some(x => x.produto === prod && x.noCarrinho && !x.arquivado);
                let tagPromoHtml = '';
                
                const oferta = OfertasDB.buscarTodas().find(o => 
                    o.produto?.toLowerCase() === prod.toLowerCase()
                );
                
                if (oferta) {
                    tagPromoHtml = `<br><span class="tag-melhor-preco">🏷️ Oferta: R$ ${oferta.valorOferta?.toFixed(2) || '0,00'} (${oferta.mercado || 'Desconhecido'})</span>`;
                }

                paginaGabarito.innerHTML += `
                <div class="item-card">
                    <div>
                        <h3>${prod}</h3>
                        ${tagPromoHtml}
                    </div>
                    <button class="btnAdicionar ${jaAdicionado ? 'ja-adicionado' : ''}" 
                            onclick="${jaAdicionado ? '' : `adicionarAoCarrinho('${prod.replace(/'/g, "\\'")}')`}">
                        ${jaAdicionado ? '✔ Na Lista' : '➕ Adicionar'}
                    </button>
                </div>`;
            });
        });
    }

    if (abaAtual === "carrinho") {
        document.getElementById("secaoSugestoes").style.display = "none";
        const paginaCarrinho = document.getElementById("paginaCarrinho");
        paginaCarrinho.innerHTML = "";
        let itensAtivos = compras.filter(x => x.noCarrinho && !x.arquivado);

        if(itensAtivos.length === 0) {
            paginaCarrinho.innerHTML = `<p style="text-align:center; color:var(--cinza); padding:30px; grid-column: 1 / -1;">Sua lista atual está vazia.</p>`;
        }

        let categoriesCarrinho = {};
        itensAtivos.forEach(item => {
            if (busca && !item.produto.toLowerCase().includes(busca)) return;
            let cat = obterCategoria(item.produto);
            if(!categoriesCarrinho[cat]) categoriesCarrinho[cat] = [];
            categoriesCarrinho[cat].push(item);
        });

        Object.keys(categoriesCarrinho).sort().forEach(cat => {
            paginaCarrinho.innerHTML += `<div class="titulo-categoria">${cat}</div>`;
            categoriesCarrinho[cat].forEach(item => {
                const indexReal = compras.findIndex(x => x.id === item.id);
                let preçoSugerido = item.valor || 0;
                
                let textoOferta = "";
                const oferta = OfertasDB.buscarTodas().find(o => 
                    o.produto?.toLowerCase() === item.produto.toLowerCase()
                );
                
                if (oferta) {
                    textoOferta = `<br><span class="tag-melhor-preco">🏷️ Oferta: R$ ${oferta.valorOferta?.toFixed(2) || '0,00'} (${oferta.mercado || 'Desconhecido'})</span>`;
                }

                paginaCarrinho.innerHTML += `
                <div class="item-card ${item.comprado ? 'comprado' : ''}">
                    <div class="flex-col">
                        <div class="topo-card">
                            <div>
                                <h3 onclick="toggleDetalhesCard(${item.id})">${item.produto}</h3>
                                ${textoOferta}
                            </div>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <button class="btnToggleDetalhes" onclick="toggleDetalhesCard(${item.id})">⚙ Config</button>
                                <button class="btnRemover" onclick="removerDoCarrinho(${indexReal})">✕</button>
                            </div>
                        </div>
                        
                        <div id="detalhes-${item.id}" class="detalhes-produto">
                            <div class="linha-inputs">
                                <div class="campo">
                                    <label>Status</label>
                                    <select id="statusSelect-${item.id}" onchange="alterarStatus(${indexReal}, this.value, ${item.id})">
                                        <option value="false" ${!item.comprado ? 'selected' : ''}>⚠ Falta</option>
                                        <option value="true" ${item.comprado ? 'selected' : ''}>✔ Ok</option>
                                    </select>
                                </div>
                                <div class="campo">
                                    <label>Qtd</label>
                                    <input type="number" style="width:50px;" min="1" value="${item.quantidade || 1}" onchange="alterarQuantidade(${indexReal}, this.value)">
                                </div>
                                <div class="campo">
                                    <label>Preço Unit.</label>
                                    <input type="number" style="width:70px;" step="0.01" placeholder="${preçoSugerido ? preçoSugerido.toFixed(2) : '0,00'}" value="${item.valor || ''}" onchange="alterarValor(${indexReal}, this.value)">
                                </div>
                                <div class="campo">
                                    <label>Mercado</label>
                                    <input type="text" style="width:100px;" placeholder="Ex: Atacadão" value="${item.mercado || ''}" onchange="alterarMercado(${indexReal}, this.value)">
                                </div>
                                <div class="campo">
                                    <label>Data</label>
                                    <input type="date" style="width:110px;" value="${item.data || ''}" onchange="alterarData(${indexReal}, this.value)">
                                </div>
                                <div class="campo" style="margin-left:auto; text-align:right;">
                                    <label>Subtotal</label>
                                    <div class="valor-total">R$ ${((item.valor || 0) * (item.quantidade || 1)).toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        });
    }

    renderizarFavoritos();
    carregarFiltroProdutosGrafico();
    
    if (abaAtual === "ofertas") {
        carregarOfertas();
    }
}

function toggleDetalhesCard(id) {
    const elem = document.getElementById(`detalhes-${id}`);
    if(elem) elem.classList.toggle("ativo");
}

function cadastrarNovoProdutoGeral() {
    const inputBusca = document.getElementById("busca");
    const nomeNovo = inputBusca.value.trim();
    if (!nomeNovo) return;
    if (!gabaritoCustomizado.some(x => x.toLowerCase() === nomeNovo.toLowerCase())) {
        gabaritoCustomizado.push(nomeNovo);
        localStorage.setItem("gabarito_custom", JSON.stringify(gabaritoCustomizado));
    }
    adicionarAoCarrinho(nomeNovo);
    inputBusca.value = "";
    carregar();
}

function adicionarAoCarrinho(nomeProduto) {
    compras.push({
        id: Date.now() + Math.random(),
        produto: nomeProduto,
        quantidade: 1,
        valor: 0,
        mercado: "",
        data: new Date().toISOString().split('T')[0],
        comprado: false,
        noCarrinho: true,
        arquivado: false
    });
    salvar();
}

function removerDoCarrinho(index) {
    if(compras[index].valor === 0) compras.splice(index, 1); else compras[index].noCarrinho = false;
    salvar();
}

function mudarAba(aba) {
    abaAtual = aba;
    document.querySelectorAll('.menu button').forEach(b => b.classList.remove('ativo'));
    const btnMap = {
        'gabarito': 'btnAbaGabarito',
        'carrinho': 'btnAbaCarrinho',
        'historico': 'btnAbaHistorico',
        'ofertas': 'btnAbaOfertas'
    };
    const btn = document.getElementById(btnMap[aba]);
    if (btn) btn.classList.add('ativo');

    document.getElementById("paginaGabarito").classList.add("oculto");
    document.getElementById("paginaCarrinho").classList.add("oculto");
    document.getElementById("paginaHistorico").classList.add("oculto");
    document.getElementById("paginaOfertas").classList.add("oculto");
    document.getElementById("secaoScanner").classList.add("oculto");

    if (aba === "gabarito") {
        document.getElementById("paginaGabarito").classList.remove("oculto");
        document.getElementById("secaoScanner").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "block";
    } else if (aba === "carrinho") {
        document.getElementById("paginaCarrinho").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "none";
    } else if (aba === "historico") {
        document.getElementById("paginaHistorico").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "none";
        carregarFiltroProdutosGrafico();
    } else if (aba === "ofertas") {
        document.getElementById("paginaOfertas").classList.remove("oculto");
        document.getElementById("secaoSugestoes").style.display = "none";
        carregarOfertas();
    }
    carregar();
}

function salvar() {
    localStorage.setItem("compras_v3", JSON.stringify(compras));
    carregar();
}

function alterarStatus(index, status, id) {
    compras[index].comprado = (status === "true");
    salvar();
}

function alterarQuantidade(index, qtd) { compras[index].quantidade = parseFloat(qtd); salvar(); }
function alterarValor(index, val) { compras[index].valor = parseFloat(val); salvar(); }
function alterarMercado(index, mkt) { compras[index].mercado = mkt; salvar(); }
function alterarData(index, dt) { compras[index].data = dt; salvar(); }

function novoMes() {
    if(confirm("Deseja fechar o mês e arquivar a lista atual?")) {
        compras.forEach(item => { if(item.comprado) item.arquivado = true; item.noCarrinho = false; });
        salvar();
    }
}

function renderizarFavoritos() {
    const boxSugestoes = document.getElementById("secaoSugestoes");
    const divFavs = document.getElementById("listaFavoritos");
    divFavs.innerHTML = "";
    
    let contagem = {};
    compras.filter(x => x.comprado).forEach(x => {
        contagem[x.produto] = (contagem[x.produto] || 0) + 1;
    });
    
    let ordenados = Object.keys(contagem).filter(prod => contagem[prod] >= 2);
    ordenados.sort((a,b) => contagem[b] - contagem[a]);
    
    if(ordenados.length === 0 || abaAtual !== "gabarito") {
        boxSugestoes.style.display = "none";
        return;
    }
    boxSugestoes.style.display = "block";

    let exibidos = 0;
    for (let i = 0; i < ordenados.length; i++) {
        if (exibidos >= 7) break;
        let prod = ordenados[i];
        const jaAdicionado = compras.some(x => x.produto === prod && x.noCarrinho && !x.arquivado);
        if(!jaAdicionado) {
            divFavs.innerHTML += `<div class="badge-item" onclick="adicionarAoCarrinho('${prod.replace(/'/g, "\\'")}')">➕ ${prod}</div>`;
            exibidos++;
        }
    }
    if (exibidos === 0) boxSugestoes.style.display = "none";
}

function importarDoExtrator() {
    const dadosExtrator = localStorage.getItem("produtos_extrator");
    if (!dadosExtrator) {
        alert("⚠️ Nenhum produto encontrado no extrator.");
        return;
    }
    try {
        const produtos = JSON.parse(dadosExtrator);
        if (!produtos || produtos.length === 0) {
            alert("⚠️ Nenhum produto válido encontrado.");
            return;
        }
        let adicionados = 0;
        for (const item of produtos) {
            const existe = compras.some(x => 
                x.produto.toLowerCase() === item.produto.toLowerCase() && 
                x.noCarrinho && 
                !x.arquivado
            );
            if (!existe) {
                compras.push({
                    id: Date.now() + Math.random() + adicionados,
                    produto: item.produto,
                    quantidade: 1,
                    valor: item.preco || 0,
                    mercado: item.mercado || "DESCO",
                    data: new Date().toISOString().split('T')[0],
                    comprado: false,
                    noCarrinho: true,
                    arquivado: false,
                    origem: "extrator"
                });
                adicionados++;
            }
        }
        salvar();
        alert(`✅ ${adicionados} produtos adicionados à lista!`);
    } catch (e) {
        alert("❌ Erro ao importar produtos.");
    }
}

// ============================================================
// ===== FUNÇÕES DE BACKUP =====
// ============================================================
function exportarDados() {
    const dados = {
        compras: compras,
        gabarito: gabaritoCustomizado,
        ofertas: OfertasDB.buscarTodas(),
        notas: DB.buscarNotas(),
        data: new Date().toISOString()
    };
    const json = JSON.stringify(dados, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function importarDados() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const dados = JSON.parse(event.target.result);
                if (dados.compras) {
                    compras = dados.compras;
                    localStorage.setItem("compras_v3", JSON.stringify(compras));
                }
                if (dados.gabarito) {
                    gabaritoCustomizado = dados.gabarito;
                    localStorage.setItem("gabarito_custom", JSON.stringify(gabaritoCustomizado));
                }
                if (dados.ofertas) {
                    OfertasDB.ofertas = dados.ofertas;
                    OfertasDB.salvar();
                }
                if (dados.notas) {
                    DB.notasFiscais = dados.notas;
                    DB.salvar();
                }
                alert('✅ Dados importados com sucesso!');
                carregar();
                carregarOfertas();
            } catch (error) {
                alert('❌ Erro ao importar dados: ' + error.message);
            }
        };
        reader.readAsText(file);
    };
    input.click();
}
