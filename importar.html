<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator DESCO - PERFEITO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }
        .file-area {
            border: 2px dashed #cbd5e1;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.3s;
            margin: 15px 0;
        }
        .file-area:hover { border-color: #7c3aed; background: #f1f5f9; }
        .file-area input[type="file"] { display: none; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s;
            color: white;
            min-width: 120px;
        }
        .btn-primary { background: #7c3aed; }
        .btn-primary:hover { background: #6d28d9; transform: translateY(-2px); }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 500;
        }
        .status.loading { background: #fef3c7; color: #92400e; }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .status.info { background: #dbeafe; color: #1e40af; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-merc { background: #d1fae5; color: #065f46; }
        .badge-preco { background: #fef3c7; color: #92400e; }
        .extracted-item {
            background: white;
            padding: 8px 12px;
            margin: 3px 0;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .extracted-item .produto { font-weight: 600; flex: 2; min-width: 200px; }
        .extracted-item .preco { color: #7c3aed; font-weight: bold; }
        .extracted-item .mercado { color: #059669; font-size: 13px; }
        .stats {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .stats span {
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            border-left: 4px solid #7c3aed;
            max-height: 250px;
            overflow-y: auto;
        }
        .result-box pre {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar .fill {
            height: 100%;
            background: #7c3aed;
            width: 0%;
            transition: width 0.3s;
        }
        .grid-produtos {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2px;
            max-height: 500px;
            overflow-y: auto;
        }
        .count-badge {
            background: #7c3aed;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        .texto-extraido {
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            margin: 10px 0;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛒 Extrator DESCO <span class="count-badge" id="countBadge">0</span></h1>
    <p class="subtitle">100% DINÂMICO - Extrai QUALQUER produto do PDF automaticamente</p>

    <div class="file-area" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept=".pdf">
        <div>📁 <strong>Clique para selecionar</strong> o PDF do DESCO</div>
        <small style="color:#888;">SEM PRODUTOS FIXOS - Funciona com QUALQUER PDF</small>
    </div>

    <div class="btn-group">
        <button class="btn-primary" onclick="processarArquivo()">📄 Extrair Produtos</button>
        <button class="btn-success" onclick="salvarBanco()">💾 Salvar no Banco</button>
        <button class="btn-warning" onclick="baixarJSON()">📥 Baixar JSON</button>
        <button class="btn-danger" onclick="limparDados()">🗑️ Limpar</button>
    </div>

    <div id="status" class="status info">Aguardando PDF...</div>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>

    <div id="textoPreview" style="display:none;">
        <strong>📝 Texto Extraído:</strong>
        <div class="texto-extraido" id="textoExtraido"></div>
    </div>

    <div id="preview" style="display:none;">
        <h3>📊 Produtos Encontrados</h3>
        <div id="stats" class="stats"></div>
        <div id="extractedList" class="grid-produtos"></div>
    </div>

    <div class="result-box">
        <strong>📋 Log:</strong>
        <pre id="output">Aguardando ação...</pre>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCAM7Vq5SS05e4Hy9HRBg7nNqvMvllrFos",
        authDomain: "economizamais-b1c42.firebaseapp.com",
        projectId: "economizamais-b1c42",
        storageBucket: "economizamais-b1c42.firebasestorage.app",
        messagingSenderId: "271380422087",
        appId: "1:271380422087:web:081c6fa0e89c4695fccde2",
        measurementId: "G-Y0SZD7QRQQ"
    };

    let db = null;
    let firebaseInicializado = false;

    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        firebaseInicializado = true;
    } catch (error) {
        console.warn('⚠️ Firebase não inicializado:', error.message);
        firebaseInicializado = false;
    }

    let produtosExtraidos = [];

    function log(msg, tipo = 'info') {
        const output = document.getElementById('output');
        const timestamp = new Date().toLocaleTimeString();
        output.textContent += `\n[${timestamp}] ${msg}`;
        output.scrollTop = output.scrollHeight;
        const status = document.getElementById('status');
        status.className = `status ${tipo}`;
        status.textContent = msg;
    }

    function setProgress(value) {
        document.getElementById('progressFill').style.width = value + '%';
    }

    // 🔍 EXTRAIR PRODUTOS - 100% DINÂMICO E PERFEITO
    function extrairProdutos(texto) {
        log("🔍 Extraindo produtos...", 'loading');
        setProgress(30);
        
        const produtos = [];
        const mercado = "DESCO GERAL";
        
        // Remover quebras de linha e espaços extras
        let textoLimpo = texto.replace(/\n/g, ' ').replace(/\s+/g, ' ');
        
        // Encontrar TODOS os preços no formato "2 , 49" ou "2,49"
        const regexPreco = /([0-9]+)\s*,\s*([0-9]{2})/g;
        let match;
        let ultimoIndex = 0;
        let todosProdutos = [];
        
        // Primeiro, encontrar todas as posições dos preços
        const posicoes = [];
        while ((match = regexPreco.exec(textoLimpo)) !== null) {
            posicoes.push({
                index: match.index,
                preco: parseFloat(match[1] + '.' + match[2]),
                length: match[0].length
            });
        }
        
        log(`📊 Encontrados ${posicoes.length} preços no texto`, 'info');
        
        // Para cada preço, pegar o texto entre o preço anterior e este preço
        for (let i = 0; i < posicoes.length; i++) {
            const pos = posicoes[i];
            const preco = pos.preco;
            
            // Define o início do texto (depois do preço anterior ou início)
            let inicio = i === 0 ? 0 : posicoes[i-1].index + posicoes[i-1].length;
            
            // Pega o texto entre o preço anterior e este preço
            let trecho = textoLimpo.substring(inicio, pos.index);
            trecho = trecho.trim();
            
            // Limpa o trecho
            trecho = trecho
                .replace(/^[^A-Za-zÀ-Öà-ö0-9]+/, '')
                .replace(/\s+/g, ' ')
                .trim();
            
            // Se o trecho estiver vazio ou for muito curto, tenta pegar mais texto antes
            if (trecho.length < 3 && i > 0) {
                let inicio2 = i === 1 ? 0 : posicoes[i-2].index + posicoes[i-2].length;
                trecho = textoLimpo.substring(inicio2, pos.index);
                trecho = trecho.replace(/^[^A-Za-zÀ-Öà-ö0-9]+/, '').replace(/\s+/g, ' ').trim();
            }
            
            // Remove palavras genéricas do nome
            const remover = ['Kg', 'Un', 'Bandeja', 'Maço', 'kg', 'un', 'bandeja', 'maço', 'Resfriado', 'Resfriada', 'Congelado', 'Inteiro', 'Suco', 'Baby', 'Paulista', 'Prata', 'Verde', 'Rosa', 'Branco', 'Picado', 'Moída', 'Bovina', 'C/Osso', 'C/3', 'C/20', '1,01kg', '350g', '5kg'];
            
            let nome = trecho;
            for (const palavra of remover) {
                nome = nome.replace(new RegExp('\\b' + palavra + '\\b', 'gi'), '');
            }
            nome = nome.replace(/\s+/g, ' ').trim();
            
            // Remove "ou" e o que vem depois
            if (nome.includes(' ou ')) {
                nome = nome.split(' ou ')[0];
            }
            
            // Remove parênteses
            nome = nome.replace(/\([^)]*\)/g, '');
            
            // Remove "C/" e o que vem depois
            if (nome.includes('C/')) {
                nome = nome.split('C/')[0];
            }
            
            // Remove números soltos
            nome = nome.replace(/[0-9,.\s]+$/, '');
            
            // Limpa espaços
            nome = nome.replace(/\s+/g, ' ').trim();
            
            // Verifica se é válido
            if (nome.length > 2 && preco > 0 && preco < 1000) {
                // Verifica se não é uma palavra genérica sozinha
                let isGenerico = false;
                const genericos = ['Kg', 'Un', 'Bandeja', 'Maço', 'Resfriado', 'Resfriada', 'Congelado'];
                for (const g of genericos) {
                    if (nome.toLowerCase() === g.toLowerCase()) {
                        isGenerico = true;
                        break;
                    }
                }
                
                if (!isGenerico && !nome.match(/^[0-9,.\s]+$/)) {
                    todosProdutos.push({
                        produto: nome,
                        preco: preco,
                        mercado: mercado
                    });
                }
            }
        }
        
        // 🔥 AGRUPAR POR PRODUTO E PEGAR O MENOR PREÇO
        const mapaProdutos = {};
        for (const p of todosProdutos) {
            // Limpar nome para agrupar melhor
            let nomeLimpo = p.produto
                .replace(/\s+(kg|g|ml|l|L|Kg|KG|Un|un)\s*$/, '')
                .replace(/\s+/g, ' ')
                .trim();
            
            if (!mapaProdutos[nomeLimpo]) {
                mapaProdutos[nomeLimpo] = {
                    produto: nomeLimpo,
                    preco: p.preco,
                    mercado: p.mercado,
                    precos: [p.preco]
                };
            } else {
                mapaProdutos[nomeLimpo].precos.push(p.preco);
                if (p.preco < mapaProdutos[nomeLimpo].preco) {
                    mapaProdutos[nomeLimpo].preco = p.preco;
                }
            }
        }
        
        // Converter para array e ordenar
        const produtosUnicos = Object.values(mapaProdutos);
        produtosUnicos.sort((a, b) => a.produto.localeCompare(b.produto));
        
        // Log dos produtos encontrados
        for (const p of produtosUnicos) {
            log(`📦 ${p.produto} - R$ ${p.preco.toFixed(2)}`, 'info');
        }
        
        setProgress(100);
        log(`✅ ${produtosUnicos.length} produtos únicos encontrados`, 'success');
        return produtosUnicos;
    }

    // 📄 PROCESSAR ARQUIVO
    window.processarArquivo = async function() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) {
            log("⚠️ Selecione um arquivo PDF!", 'error');
            return;
        }

        if (file.type !== "application/pdf") {
            log("⚠️ O arquivo precisa ser PDF!", 'error');
            return;
        }

        log(`📄 Lendo: ${file.name}`, 'loading');
        setProgress(10);
        let textoBruto = "";

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            
            log(`📄 PDF tem ${pdf.numPages} páginas`, 'info');
            setProgress(20);
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageText = content.items.map(item => item.str).join(" ");
                textoBruto += pageText + "\n";
                setProgress(20 + (i / pdf.numPages) * 30);
            }

            setProgress(50);
            
            if (!textoBruto.trim()) {
                throw new Error("Nenhum texto extraído do PDF");
            }

            log(`📝 Texto extraído (${textoBruto.length} caracteres)`, 'info');
            
            document.getElementById('textoPreview').style.display = 'block';
            document.getElementById('textoExtraido').textContent = textoBruto;
            
            setProgress(60);
            
            const produtos = extrairProdutos(textoBruto);
            
            if (produtos.length > 0) {
                produtosExtraidos = produtos;
                exibirResultado(produtos);
                document.getElementById('countBadge').textContent = produtos.length;
                log(`✅ ${produtos.length} produtos encontrados!`, 'success');
                setProgress(100);
            } else {
                log("❌ Nenhum produto encontrado.", 'error');
                setProgress(0);
            }
            
        } catch (error) {
            log("❌ Erro: " + error.message, 'error');
            setProgress(0);
            console.error(error);
        }
    };

    // 📊 EXIBIR RESULTADO
    function exibirResultado(produtos) {
        const preview = document.getElementById('preview');
        preview.style.display = 'block';

        const list = document.getElementById('extractedList');
        list.innerHTML = '';
        
        const stats = document.getElementById('stats');
        const total = produtos.reduce((s, p) => s + p.preco, 0);
        const media = produtos.length > 0 ? total / produtos.length : 0;
        const max = Math.max(...produtos.map(p => p.preco));
        const min = Math.min(...produtos.map(p => p.preco));
        
        stats.innerHTML = `
            <span>📦 ${produtos.length} produtos</span>
            <span>🏪 DESCO</span>
            <span>💰 Média: R$ ${media.toFixed(2)}</span>
            <span>💵 Total: R$ ${total.toFixed(2)}</span>
            <span>📈 Max: R$ ${max.toFixed(2)}</span>
            <span>📉 Min: R$ ${min.toFixed(2)}</span>
        `;

        produtos.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'extracted-item';
            div.innerHTML = `
                <span class="produto">${item.produto}</span>
                <span>
                    <span class="badge badge-merc">${item.mercado}</span>
                    <span class="badge badge-preco">R$ ${item.preco.toFixed(2)}</span>
                </span>
            `;
            list.appendChild(div);
        });
    }

    // 💾 SALVAR NO BANCO
    window.salvarBanco = async function() {
        if (!produtosExtraidos || produtosExtraidos.length === 0) {
            log("⚠️ Nenhum dado para salvar!", 'error');
            return;
        }

        if (!firebaseInicializado || !db) {
            log("⚠️ Firebase não inicializado! Use 'Baixar JSON'", 'error');
            return;
        }

        log(`💾 Salvando ${produtosExtraidos.length} produtos...`, 'loading');
        
        let salvos = 0;
        let erros = 0;

        for (const item of produtosExtraidos) {
            try {
                await addDoc(collection(db, "ofertas_dia"), {
                    produto: item.produto,
                    mercado: item.mercado,
                    valorOferta: item.preco,
                    data: new Date().toISOString().split('T')[0],
                    timestamp: serverTimestamp(),
                    importado: true,
                    fonte: "DESCO",
                    menor_preco: true
                });
                salvos++;
            } catch (error) {
                erros++;
                console.error(`Erro ao salvar ${item.produto}:`, error);
            }
        }

        if (erros > 0) {
            log(`⚠️ ${salvos} salvos, ${erros} erros. Use 'Baixar JSON' como fallback.`, 'error');
        } else {
            log(`✅ ${salvos} produtos salvos com sucesso!`, 'success');
            alert(`✅ ${salvos} produtos salvos no banco de dados!`);
        }
    };

    // 📥 BAIXAR JSON
    window.baixarJSON = function() {
        if (!produtosExtraidos || produtosExtraidos.length === 0) {
            log("⚠️ Nenhum produto para baixar!", 'error');
            return;
        }

        const data = {
            mercado: "DESCO GERAL",
            data: new Date().toISOString().split('T')[0],
            total_produtos: produtosExtraidos.length,
            produtos: produtosExtraidos.map(p => ({
                nome: p.produto,
                preco: p.preco,
                mercado: p.mercado
            }))
        };

        const json = JSON.stringify(data, null, 2);
        
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ofertas_desco_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);

        log(`📥 JSON baixado com ${produtosExtraidos.length} produtos!`, 'success');
        alert(`📥 JSON baixado com ${produtosExtraidos.length} produtos!`);
    };

    // 🗑️ LIMPAR
    window.limparDados = function() {
        produtosExtraidos = [];
        document.getElementById('preview').style.display = 'none';
        document.getElementById('extractedList').innerHTML = '';
        document.getElementById('stats').innerHTML = '';
        document.getElementById('textoPreview').style.display = 'none';
        document.getElementById('fileInput').value = '';
        document.getElementById('countBadge').textContent = '0';
        setProgress(0);
        log("🗑️ Limpo!", 'info');
    };

    window.processarArquivo = window.processarArquivo;
    window.salvarBanco = window.salvarBanco;
    window.baixarJSON = window.baixarJSON;
    window.limparDados = window.limparDados;

    log("🚀 Aguardando o PDF! - 100% DINÂMICO", 'info');
    log("📌 SEM PRODUTOS FIXOS - Funciona com QUALQUER PDF", 'info');
</script>
</body>
</html>
