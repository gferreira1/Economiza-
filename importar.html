<script>
// ============================================================
// ===== BANCO DE DADOS LOCAL (SIMULAÇÃO) =====

// Estrutura do "banco de dados" local
const DB = {
    // Tabela de notas fiscais escaneadas
    notasFiscais: JSON.parse(localStorage.getItem('notas_fiscais_db')) || [],
    
    // Tabela de produtos da nota atual
    produtosNota: JSON.parse(localStorage.getItem('produtos_nota_atual')) || [],
    
    // Salvar no localStorage
    salvar() {
        localStorage.setItem('notas_fiscais_db', JSON.stringify(this.notasFiscais));
        localStorage.setItem('produtos_nota_atual', JSON.stringify(this.produtosNota));
    },
    
    // Adicionar nota fiscal
    adicionarNota(nota) {
        // Verifica se já existe pela chave de acesso
        const existe = this.notasFiscais.find(n => n.chaveAcesso === nota.chaveAcesso);
        if (existe) {
            // Atualiza dados existentes
            Object.assign(existe, nota);
            existe.atualizadoEm = new Date().toISOString();
        } else {
            // Adiciona nova nota
            nota.criadoEm = new Date().toISOString();
            nota.atualizadoEm = new Date().toISOString();
            this.notasFiscais.unshift(nota);
        }
        this.salvar();
        return nota;
    },
    
    // Buscar todas as notas
    buscarNotas() {
        return this.notasFiscais;
    },
    
    // Buscar nota por chave de acesso
    buscarNotaPorChave(chave) {
        return this.notasFiscais.find(n => n.chaveAcesso === chave);
    },
    
    // Adicionar produtos extraídos da nota
    adicionarProdutosNota(produtos) {
        this.produtosNota = produtos;
        this.salvar();
        return produtos;
    },
    
    // Buscar produtos da nota atual
    buscarProdutosNota() {
        return this.produtosNota;
    }
};

/**
 * Função principal que processa o QR Code da nota fiscal
 * Extrai informações e adiciona à lista de compras
 */
async function processarQRCodeNotaFiscal(qrData) {
    try {
        console.log('📱 QR Code lido:', qrData);
        
        // Mostra feedback visual
        mostrarFeedback('⏳ Processando nota fiscal...', 'info');
        
        // 1. Extrair dados do QR Code
        const dadosNota = extrairDadosNotaFiscal(qrData);
        
        if (!dadosNota) {
            mostrarFeedback('❌ QR Code inválido ou não reconhecido!', 'erro');
            return false;
        }
        
        console.log('📄 Dados extraídos da nota:', dadosNota);
        
        // 2. Salvar no banco de dados local
        const notaSalva = DB.adicionarNota(dadosNota);
        console.log('💾 Nota salva no banco:', notaSalva);
        
        // 3. Extrair produtos da nota (usando dados do QR ou API)
        let produtos = [];
        
        // Tenta extrair produtos do QR Code (se vierem no formato)
        if (dadosNota.produtos && dadosNota.produtos.length > 0) {
            produtos = dadosNota.produtos;
        } else {
            // Se não tiver produtos no QR, busca via API (simulação)
            produtos = await buscarProdutosNotaAPI(dadosNota.chaveAcesso);
        }
        
        // 4. Salvar produtos extraídos
        DB.adicionarProdutosNota(produtos);
        
        // 5. Adicionar produtos à lista de compras
        const adicionados = await adicionarProdutosListaCompras(produtos);
        
        // 6. Atualizar interface
        mostrarFeedback(`✅ Nota fiscal processada! ${adicionados} produtos adicionados.`, 'sucesso');
        
        // 7. Mostrar resumo da nota
        mostrarResumoNota(dadosNota, produtos);
        
        // 8. Forçar recarregamento da lista
        carregar();
        
        return true;
        
    } catch (error) {
        console.error('❌ Erro ao processar QR Code:', error);
        mostrarFeedback('❌ Erro ao processar nota fiscal: ' + error.message, 'erro');
        return false;
    }
}

/**
 * Extrai dados estruturados do QR Code da nota fiscal
 * Suporta diferentes formatos de QR Code (NFC-e, Danfe, etc.)
 */
function extrairDadosNotaFiscal(qrData) {
    try {
        // Se for URL com parâmetros
        if (qrData.includes('?') || qrData.includes('&')) {
            const urlParams = new URLSearchParams(qrData.split('?')[1] || '');
            
            // Parâmetros comuns da NFC-e
            const chave = urlParams.get('chave') || urlParams.get('p') || '';
            const numero = urlParams.get('n') || urlParams.get('numero') || '';
            
            if (chave) {
                return {
                    chaveAcesso: chave,
                    numero: numero,
                    valorTotal: parseFloat(urlParams.get('v') || '0'),
                    dataEmissao: urlParams.get('d') || new Date().toISOString().split('T')[0],
                    cnpjEmitente: urlParams.get('c') || '',
                    nomeEmitente: urlParams.get('e') || 'Desconhecido',
                    produtos: []
                };
            }
        }
        
        // Formato compacto (chave de acesso de 44 dígitos)
        if (/^\d{44}$/.test(qrData)) {
            const chave = qrData;
            // Extrai informações da chave (formato padrão)
            const data = chave.substring(0, 6); // AAMMDD
            const cnpj = chave.substring(6, 20);
            const numero = chave.substring(25, 34);
            
            return {
                chaveAcesso: chave,
                numero: numero,
                valorTotal: 0, // Precisa buscar via API
                dataEmissao: `20${data.substring(0,2)}-${data.substring(2,4)}-${data.substring(4,6)}`,
                cnpjEmitente: cnpj,
                nomeEmitente: 'Desconhecido',
                produtos: []
            };
        }
        
        // Tenta parsear como JSON
        try {
            const jsonData = JSON.parse(qrData);
            if (jsonData.chave_acesso || jsonData.chaveAcesso) {
                return {
                    chaveAcesso: jsonData.chave_acesso || jsonData.chaveAcesso,
                    numero: jsonData.numero || jsonData.numero_nota || '',
                    valorTotal: parseFloat(jsonData.valor_total || jsonData.valor || 0),
                    dataEmissao: jsonData.data_emissao || jsonData.data || new Date().toISOString().split('T')[0],
                    cnpjEmitente: jsonData.cnpj_emitente || jsonData.cnpj || '',
                    nomeEmitente: jsonData.nome_emitente || 'Desconhecido',
                    produtos: jsonData.produtos || []
                };
            }
        } catch (e) {}
        
        // Formato com campos separados
        const campos = qrData.split('|');
        if (campos.length >= 2) {
            return {
                chaveAcesso: campos[0] || '',
                numero: campos[1] || '',
                valorTotal: parseFloat(campos[2] || '0'),
                dataEmissao: campos[3] || new Date().toISOString().split('T')[0],
                cnpjEmitente: campos[4] || '',
                nomeEmitente: campos[5] || 'Desconhecido',
                produtos: []
            };
        }
        
        return null;
        
    } catch (error) {
        console.error('Erro ao extrair dados do QR:', error);
        return null;
    }
}

/**
 * Busca os produtos da nota fiscal via API (simulação)
 * Na vida real, isso chamaria uma API da SEFAZ ou serviço de consulta
 */
async function buscarProdutosNotaAPI(chaveAcesso) {
    // Simula uma chamada à API
    console.log('🔍 Buscando produtos da nota:', chaveAcesso);
    
    // Simula delay de rede
    await new Promise(resolve => setTimeout(resolve, 500));
    
    // Simula resposta com produtos (na vida real, viria da API)
    const produtosSimulados = [
        { produto: 'Arroz', quantidade: 1, preco: 8.89, mercado: 'Miller' },
        { produto: 'Feijão', quantidade: 1, preco: 4.49, mercado: 'Desco' },
        { produto: 'Óleo', quantidade: 1, preco: 5.99, mercado: 'Via' },
        { produto: 'Açúcar', quantidade: 1, preco: 14.95, mercado: 'Desco' },
        { produto: 'Café', quantidade: 1, preco: 19.90, mercado: 'Miller' }
    ];
    
    // Simula produtos baseados na chave para variar
    const hash = chaveAcesso.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
    const quantidade = (hash % 5) + 3; // 3 a 7 produtos
    
    return produtosSimulados.slice(0, quantidade);
}

/**
 * Adiciona os produtos extraídos à lista de compras
 */
async function adicionarProdutosListaCompras(produtos) {
    let adicionados = 0;
    
    for (const item of produtos) {
        // Verifica se já está na lista
        const jaExiste = compras.some(x => 
            x.produto.toLowerCase() === item.produto.toLowerCase() && 
            x.noCarrinho && 
            !x.arquivado
        );
        
        if (!jaExiste) {
            // Adiciona com os dados da nota
            compras.push({
                id: Date.now() + Math.random() + adicionados,
                produto: item.produto,
                quantidade: item.quantidade || 1,
                valor: parseFloat(item.preco) || 0,
                mercado: item.mercado || 'Desconhecido',
                data: new Date().toISOString().split('T')[0],
                comprado: false,
                noCarrinho: true,
                arquivado: false,
                origem: 'nota_fiscal'
            });
            adicionados++;
        }
    }
    
    if (adicionados > 0) {
        salvar(); // Salva no localStorage
    }
    
    return adicionados;
}

/**

    console.log(resumo);

    mostrarNotificacao('Nota fiscal processada!', `${produtos.length} produtos adicionados à lista.`);

/**
 * Feedback visual para o usuário
 */
function mostrarFeedback(mensagem, tipo = 'info') {
    const cores = {
        info: '#3b82f6',
        sucesso: '#22c55e',
        erro: '#ef4444',
        alerta: '#f59e0b'
    };
    
    // Remove feedbacks antigos
    const antigos = document.querySelectorAll('.feedback-flutuante');
    antigos.forEach(el => el.remove());
    
    const div = document.createElement('div');
    div.className = 'feedback-flutuante';
    div.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: ${cores[tipo] || cores.info};
        color: white;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        z-index: 10000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        max-width: 90%;
        text-align: center;
        animation: fadeInUp 0.3s ease;
    `;
    div.textContent = mensagem;
    document.body.appendChild(div);
    
    setTimeout(() => {
        div.style.animation = 'fadeOutDown 0.3s ease';
        setTimeout(() => div.remove(), 300);
    }, 4000);
}

    setTimeout(() => {
        notificacao.style.animation = 'slideOutRight 0.4s ease';

}

// Substitui a função alternarScanner original
const alternarScannerOriginal = window.alternarScanner;

window.alternarScanner = function() {
    const btn = document.getElementById("btnIniciarCamera");
    const reader = document.getElementById("reader");
    
    if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => {
            btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
            btn.style.background = "#4f46e5";
            reader.style.display = 'none';
        }).catch(err => console.log(err));
        return;
    }
    
    btn.innerText = "🛑 Desligar Câmera";
    btn.style.background = "#ef4444";
    reader.style.display = 'block';
    
    if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
    }
    
    html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async (qrCodeMessage) => {
            // Processa o QR Code com nossa nova função
            await processarQRCodeNotaFiscal(qrCodeMessage);
            
            // Para o scanner após ler
            html5QrcodeScanner.stop().then(() => {
                btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
                btn.style.background = "#4f46e5";
                reader.style.display = 'none';
            }).catch(err => console.log(err));
        },
        (errorMessage) => {
            // Ignora erros de leitura contínua
        }
    ).catch(err => {
        alert("❌ Erro ao acessar a câmera. Verifique as permissões.");
        btn.innerText = "📷 Escanear QR Code da Nota Gaúcha";
        btn.style.background = "#4f46e5";
        reader.style.display = 'none';
    });
};

// ===== FUNÇÃO PARA VISUALIZAR NOTAS ESCANEADAS =====
// ============================================================

function visualizarNotasEscaneadas() {
    const notas = DB.buscarNotas();
    
    if (notas.length === 0) {
        alert('📭 Nenhuma nota fiscal escaneada ainda.');
        return;
    }
    
    let mensagem = '📋 NOTAS FISCAIS ESCANEADAS:\n\n';
    mensagem += '═'.repeat(40) + '\n';
    
    notas.forEach((nota, index) => {
        mensagem += `📄 NOTA #${index + 1}\n`;
        mensagem += `   Chave: ${nota.chaveAcesso.substring(0, 15)}...\n`;
        mensagem += `   Número: ${nota.numero || 'N/A'}\n`;
        mensagem += `   Emitente: ${nota.nomeEmitente || 'N/A'}\n`;
        mensagem += `   Data: ${nota.dataEmissao || 'N/A'}\n`;
        mensagem += `   Valor: R$ ${nota.valorTotal?.toFixed(2) || '0,00'}\n`;
        mensagem += `   Escaneado: ${new Date(nota.criadoEm).toLocaleString()}\n`;
        mensagem += '─'.repeat(40) + '\n';
    });
    
    // Mostra em um alert ou modal
    alert(mensagem);
}
